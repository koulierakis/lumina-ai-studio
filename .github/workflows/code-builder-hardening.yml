name: code-builder-hardening

on:
  push:
    branches:
      - work/code-builder-refresh
  pull_request:
    branches:
      - release/lumina-complete

permissions:
  contents: read

jobs:
  focused-code-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Validate remote finalizer syntax
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content -Raw './REMOTE_FINALIZE_CODE_BUILDER.ps1')) | Out-Null"
      - name: Compile committed Code Builder
        run: python -m py_compile backend/code_builder/router.py backend/code_builder/task_service.py backend/code_builder/planning_service.py backend/code_builder/patch_service.py backend/code_builder/build_service.py backend/code_builder/ollama_service.py
      - name: Run all Code Builder and planning tests
        run: python -m pytest backend/tests/test_code_builder*.py backend/tests/test_planning*.py -q
      - name: Verify committed hardening repairs are repeat-safe
        run: |
          python tools/apply_code_builder_hardening.py
          python tools/apply_code_builder_path_tracking_hardening.py
          python tools/apply_code_builder_policy_hardening.py
          python tools/apply_code_builder_review_adapter.py
          python tools/apply_code_builder_review_gate.py
          python tools/apply_code_builder_stale_guard.py
          python tools/apply_code_builder_idempotency_guard.py
          python tools/apply_code_builder_approval_phase_guard.py
          python tools/apply_code_builder_ui_hardening.py
          git diff --exit-code -- backend/code_builder/router.py backend/code_builder/task_service.py frontend/src/pages/CodeBuilder.jsx
      - name: Verify runtime planning repair reaches hardened defaults
        run: |
          python tools/apply_code_builder_planning_defaults.py
          python -c "from backend.code_builder.planning_service import PlanningConfiguration; c=PlanningConfiguration(); assert c.maximum_repair_attempts == 2; assert c.maximum_output_tokens == 1024; assert c.input_token_safety_margin == 256; print('PLANNING RUNTIME HARDENING OK')"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Code Builder UI regression test
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand src/pages/CodeBuilder.test.js
      - name: Build Code Builder frontend
        working-directory: frontend
        run: npm run build
