name: code-builder-hardening

on:
  push:
    branches:
      - work/code-builder-refresh
  pull_request:
    paths:
      - 'backend/code_builder/**'
      - 'backend/tests/test_code_builder_hardening_contract.py'
      - 'backend/tests/test_code_builder_transaction_boundary.py'
      - 'backend/tests/test_code_builder_execution_pipeline.py'
      - 'backend/tests/test_code_builder_timeout_contract.py'
      - 'backend/tests/test_code_builder_default_build_contract.py'
      - 'backend/tests/test_code_builder_planning_budget_contract.py'
      - 'backend/tests/test_planning_compact_context.py'
      - 'backend/tests/test_code_builder_patch_policy_contract.py'
      - 'backend/tests/test_code_builder_review_gate_contract.py'
      - 'backend/tests/test_code_builder_review_adapter_contract.py'
      - 'backend/tests/test_code_builder_stale_file_contract.py'
      - 'backend/tests/test_code_builder_idempotency_contract.py'
      - 'backend/tests/test_code_builder_path_tracking_contract.py'
      - 'tools/apply_code_builder_planning_defaults.py'
      - '.github/workflows/code-builder-hardening.yml'

permissions:
  contents: write

jobs:
  focused-code-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Apply planning budget repair
        run: python tools/apply_code_builder_planning_defaults.py
      - name: Compile Code Builder
        run: python -m py_compile backend/code_builder/router.py backend/code_builder/task_service.py backend/code_builder/planning_service.py backend/code_builder/patch_service.py backend/code_builder/build_service.py backend/code_builder/ollama_service.py
      - name: Run planning context regressions
        run: python -m pytest backend/tests/test_planning_compact_context.py backend/tests/test_code_builder_planning_budget_contract.py -q
      - name: Run Code Builder contracts
        run: python -m pytest backend/tests/test_code_builder_hardening_contract.py backend/tests/test_code_builder_timeout_contract.py backend/tests/test_code_builder_default_build_contract.py backend/tests/test_code_builder_patch_policy_contract.py backend/tests/test_code_builder_review_gate_contract.py backend/tests/test_code_builder_review_adapter_contract.py backend/tests/test_code_builder_stale_file_contract.py backend/tests/test_code_builder_idempotency_contract.py backend/tests/test_code_builder_path_tracking_contract.py backend/tests/test_code_builder_transaction_boundary.py backend/tests/test_code_builder_execution_pipeline.py -q
      - name: Persist verified planning budget repair
        if: github.event_name == 'push' && github.ref_name == 'work/code-builder-refresh'
        run: |
          if git diff --quiet -- backend/code_builder/planning_service.py; then
            echo 'Planning budget repair is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/code_builder/planning_service.py
          git commit -m 'Fix Code Builder planning context budget'
          git push origin HEAD:work/code-builder-refresh
