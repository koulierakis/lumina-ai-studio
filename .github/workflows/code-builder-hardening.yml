name: code-builder-hardening

on:
  push:
    branches:
      - work/code-builder-refresh
  pull_request:
    paths:
      - 'backend/code_builder/**'
      - 'backend/tests/test_code_builder_hardening_contract.py'
      - 'backend/tests/test_code_builder_transaction_boundary.py'
      - 'backend/tests/test_code_builder_execution_pipeline.py'
      - 'tools/apply_code_builder_hardening.py'
      - '.github/workflows/code-builder-hardening.yml'

permissions:
  contents: write

jobs:
  focused-code-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Apply Code Builder hardening
        run: python tools/apply_code_builder_hardening.py
      - name: Compile Code Builder
        run: python -m py_compile backend/code_builder/router.py backend/code_builder/task_service.py backend/code_builder/planning_service.py backend/code_builder/patch_service.py backend/code_builder/build_service.py
      - name: Run hardening contract tests
        run: python -m pytest backend/tests/test_code_builder_hardening_contract.py -q
      - name: Run approval and transaction boundary tests
        run: python -m pytest backend/tests/test_code_builder_transaction_boundary.py backend/tests/test_code_builder_execution_pipeline.py -q
      - name: Persist verified router hardening on branch
        if: github.event_name == 'push' && github.ref_name == 'work/code-builder-refresh'
        run: |
          if git diff --quiet -- backend/code_builder/router.py; then
            echo 'Router already contains verified hardening.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/code_builder/router.py
          git commit -m 'Apply verified Code Builder runtime hardening'
          git push origin HEAD:work/code-builder-refresh
