name: code-builder-hardening

on:
  push:
    branches:
      - work/code-builder-refresh
  pull_request:
    paths:
      - 'backend/code_builder/**'
      - 'backend/tests/test_code_builder*.py'
      - 'backend/tests/test_planning*.py'
      - 'frontend/src/pages/CodeBuilder.jsx'
      - 'frontend/src/pages/CodeBuilder.test.js'
      - 'tools/apply_code_builder_ui_hardening.py'
      - 'tools/apply_code_builder_approval_phase_guard.py'
      - 'INSTALL_CODE_BUILDER_REFRESH.ps1'
      - '.github/workflows/code-builder-hardening.yml'

permissions:
  contents: write

jobs:
  focused-code-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Apply strict approval phase guard
        run: python tools/apply_code_builder_approval_phase_guard.py
      - name: Apply UI rejection-gate repair
        run: python tools/apply_code_builder_ui_hardening.py
      - name: Compile Code Builder
        run: python -m py_compile backend/code_builder/router.py backend/code_builder/task_service.py backend/code_builder/planning_service.py backend/code_builder/patch_service.py backend/code_builder/build_service.py backend/code_builder/ollama_service.py
      - name: Run all Code Builder and planning tests
        run: python -m pytest backend/tests/test_code_builder*.py backend/tests/test_planning*.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Code Builder UI regression test
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand src/pages/CodeBuilder.test.js
      - name: Build Code Builder frontend
        working-directory: frontend
        run: npm run build
      - name: Persist verified approval boundary repairs
        if: github.event_name == 'push' && github.ref_name == 'work/code-builder-refresh'
        run: |
          if git diff --quiet -- backend/code_builder/router.py frontend/src/pages/CodeBuilder.jsx; then
            echo 'Approval boundary repairs are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/code_builder/router.py frontend/src/pages/CodeBuilder.jsx
          git commit -m 'Finalize Code Builder approval boundary'
          git push origin HEAD:work/code-builder-refresh
