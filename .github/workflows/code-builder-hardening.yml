name: code-builder-hardening

on:
  push:
    branches:
      - work/code-builder-refresh

permissions:
  contents: write

jobs:
  focused-code-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Apply AI review gate
        run: python tools/apply_code_builder_review_gate.py
      - name: Compile Code Builder
        run: python -m py_compile backend/code_builder/router.py backend/code_builder/task_service.py backend/code_builder/planning_service.py backend/code_builder/patch_service.py backend/code_builder/build_service.py backend/code_builder/ollama_service.py
      - name: Run all Code Builder and planning tests
        run: python -m pytest backend/tests/test_code_builder*.py backend/tests/test_planning*.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Code Builder UI regression test
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand src/pages/CodeBuilder.test.js
      - name: Build Code Builder frontend
        working-directory: frontend
        run: npm run build
      - name: Persist verified AI review gate
        run: |
          if git diff --quiet -- backend/code_builder/router.py; then
            echo 'AI review gate is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/code_builder/router.py
          git commit -m 'Enforce Code Builder AI review before approval'
          git push origin HEAD:work/code-builder-refresh
