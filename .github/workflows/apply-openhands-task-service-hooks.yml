name: Apply OpenHands TaskService Hooks

on:
  push:
    branches:
      - work/lumina-master-completion
    paths:
      - 'ops/apply-openhands-task-service-hooks.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/lumina-master-completion
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded wiring
        run: python ops/apply-openhands-task-service-hooks.py
      - name: Compile patched TaskService
        run: python -m py_compile backend/code_builder/task_service.py backend/code_builder/task_service_engine_hooks.py
      - name: Commit wiring
        run: |
          if git diff --quiet -- backend/code_builder/task_service.py; then
            echo 'No TaskService changes required.'
            exit 0
          fi
          git config user.name 'LUMINA Completion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/code_builder/task_service.py
          git commit -m 'Wire OpenHands proposal preparation into TaskService'
          git push origin HEAD:work/lumina-master-completion
