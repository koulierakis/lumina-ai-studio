name: LUMINA Drive Production
# deployment-trigger: v51-search-nearby-reliability

on:
  push:
    branches:
      - feature/milestone1-pdf-docx-engine
    paths:
      - ".github/workflows/drive-assistant-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lumina-drive-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Drive production source
        run: |
          set -euo pipefail
          for f in index.html app-v2.js navigation-search.js shared-gps.js route-selection-bridge.js poi-catalog.js poi-enhanced.js google-places.js google-key-settings.js map-poi-layer.js map-labels.js address-autocomplete.js drive-completion.js session-bootstrap.js road-safety.js sw.js manifest.webmanifest ui-fixes.css tests/production-smoke.mjs; do test -s "drive-assistant/$f"; done
          for f in app-v2.js navigation-search.js shared-gps.js route-selection-bridge.js poi-catalog.js poi-enhanced.js google-places.js google-key-settings.js map-poi-layer.js map-labels.js address-autocomplete.js drive-completion.js road-safety.js overpass-fallback.js walking-router.js map-fallback.js user-marker-hook.js reverse-geocode-fallback.js session-bootstrap.js sw.js; do node --check "drive-assistant/$f"; done
          grep -Fq 'map-poi-layer.js?v=47' drive-assistant/index.html
          grep -Fq 'map-labels.js?v=47' drive-assistant/index.html
          grep -Fq "const CACHE='lumina-drive-v48'" drive-assistant/sw.js
          grep -Fq 'google-places.js?v=49' drive-assistant/drive-completion.js
          grep -Fq 'google-key-settings.js?v=49' drive-assistant/drive-completion.js
          grep -Fq 'poi-enhanced.js?v=49' drive-assistant/drive-completion.js
          grep -Fq 'Place.searchByText' drive-assistant/google-places.js
          grep -Fq 'Place.searchNearby' drive-assistant/google-places.js
          grep -Fq 'LuminaGooglePlaces.textSearch' drive-assistant/navigation-search.js
          grep -Fq 'LuminaGooglePlaces.nearbyProgressive' drive-assistant/poi-enhanced.js
          grep -Fq 'RADII=[1200,2500,5000,10000]' drive-assistant/poi-enhanced.js
          grep -Fq 'overpass.openstreetmap.fr' drive-assistant/poi-enhanced.js
          grep -Fq 'overpass.private.coffee' drive-assistant/overpass-fallback.js
          grep -Fq 'maps.mail.ru/osm/tools/overpass' drive-assistant/poi-catalog.js
          grep -Fq 'MIN_ZOOM=15' drive-assistant/map-poi-layer.js
          grep -Fq "map.getZoom()<14" drive-assistant/map-labels.js
          grep -Fq 'SpeechRecognition' drive-assistant/app-v2.js
          grep -Fq 'drive-vector-icon' drive-assistant/drive-completion.js
          grep -Fq 'premium mobile UI' drive-assistant/ui-fixes.css
      - name: Live provider regression smoke
        run: node drive-assistant/tests/production-smoke.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.stamp.outputs.source_sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - id: stamp
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ needs.validate.outputs.source_sha }}"
          printf '%s\n' "$SOURCE_SHA" > drive-assistant/build.txt
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > drive-assistant/deployed-at.txt
          printf '%s\n' "feature/lumina-drive-assistant/drive-assistant" > drive-assistant/deploy-source.txt
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: drive-assistant
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Drive
        env:
          EXPECTED_SHA: ${{ needs.deploy.outputs.source_sha }}
        run: |
          set -euo pipefail
          BASE="https://koulierakis.github.io/lumina-ai-studio"
          for attempt in $(seq 1 20); do
            LIVE_SHA="$(curl -fsSL --max-time 15 "$BASE/build.txt?verify=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then break; fi
            if [ "$attempt" -eq 20 ]; then echo "Live SHA mismatch: expected $EXPECTED_SHA got $LIVE_SHA"; exit 1; fi
            sleep 6
          done
          curl -fsSL "$BASE/index.html?verify=$EXPECTED_SHA" | grep -Fq 'LUMINA Drive Assistant'
          curl -fsSL "$BASE/google-places.js?verify=$EXPECTED_SHA" | grep -Fq 'Place.searchByText'
          curl -fsSL "$BASE/address-autocomplete.js?verify=$EXPECTED_SHA" | grep -Fq 'LuminaGooglePlaces.textSearch'
          curl -fsSL "$BASE/drive-completion.js?verify=$EXPECTED_SHA" | grep -Fq 'drive-vector-icon'
          curl -fsSL "$BASE/ui-fixes.css?verify=$EXPECTED_SHA" | grep -Fq 'premium mobile UI'

  record-production-result:
    needs: [deploy, verify-live]
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify-live.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - name: Record verified production SHA
        env:
          SOURCE_SHA: ${{ needs.deploy.outputs.source_sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > drive-assistant/production-verified.txt
      - name: Commit production verification marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive-assistant/production-verified.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(drive): record verified production build"
          git push origin HEAD:feature/lumina-drive-assistant