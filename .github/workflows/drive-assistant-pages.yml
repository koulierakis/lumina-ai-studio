name: LUMINA Drive Production

on:
  push:
    branches:
      - feature/lumina-drive-assistant
    paths:
      - "drive-assistant/**"
      - ".github/workflows/drive-assistant-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lumina-drive-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Drive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical Drive branch
        uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required files
        run: |
          test -s drive-assistant/index.html
          test -s drive-assistant/app-v2.js
          test -s drive-assistant/navigation-search.js
          test -s drive-assistant/navigation-search.css
          test -s drive-assistant/poi-catalog.js
          test -s drive-assistant/address-autocomplete.js
          test -s drive-assistant/sw.js
      - name: JavaScript syntax validation
        run: |
          for f in app-v2.js navigation-search.js poi-catalog.js address-autocomplete.js drive-completion.js road-safety.js overpass-fallback.js walking-router.js map-labels.js map-fallback.js user-marker-hook.js reverse-geocode-fallback.js session-bootstrap.js sw.js; do
            node --check "drive-assistant/$f"
          done
      - name: Verify new Drive interface
        run: |
          grep -q 'Αναζήτηση με όνομα ή διεύθυνση…' drive-assistant/index.html
          grep -q 'Αυτοκίνητο' drive-assistant/index.html
          grep -q 'Περπάτημα' drive-assistant/index.html
          grep -q 'Free Drive' drive-assistant/index.html
          grep -q 'Σημεία ενδιαφέροντος' drive-assistant/index.html
          grep -q "lumina-drive-v39" drive-assistant/sw.js
          grep -q "updateViaCache: 'none'" drive-assistant/index.html

  deploy:
    name: Deploy Drive
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical Drive branch
        uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - name: Stamp build
        run: |
          printf '%s\n' "${GITHUB_SHA}" > drive-assistant/build.txt
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > drive-assistant/deployed-at.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Drive only
        uses: actions/upload-pages-artifact@v3
        with:
          path: drive-assistant
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
