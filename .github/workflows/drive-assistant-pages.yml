name: LUMINA Drive Source Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Production ownership notice
        run: |
          echo "This branch is the canonical LUMINA Drive source."
          echo "GitHub Pages deployment is owned exclusively by the default-branch production workflow."
          echo "Production source remains feature/lumina-drive-assistant/drive-assistant/."
