name: LUMINA Drive Production

on:
  push:
    branches:
      - feature/milestone1-pdf-docx-engine
    paths:
      - ".github/workflows/drive-assistant-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lumina-drive-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Drive search recovery
        run: |
          set -euo pipefail
          for f in index.html app-v2.js navigation-search.js poi-catalog.js poi-enhanced.js address-autocomplete.js drive-completion.js session-bootstrap.js road-safety.js sw.js manifest.webmanifest ui-fixes.css; do test -s "drive-assistant/$f"; done
          for f in app-v2.js navigation-search.js poi-catalog.js poi-enhanced.js address-autocomplete.js drive-completion.js road-safety.js overpass-fallback.js walking-router.js map-labels.js map-fallback.js user-marker-hook.js reverse-geocode-fallback.js session-bootstrap.js sw.js; do node --check "drive-assistant/$f"; done
          grep -Fq 'Αναζήτηση με όνομα ή διεύθυνση…' drive-assistant/index.html
          grep -Fq 'height:calc(100dvh - 56px)!important' drive-assistant/ui-fixes.css
          grep -Fq '.home-toolbar' drive-assistant/ui-fixes.css
          grep -Fq 'buildHomeToolbar' drive-assistant/drive-completion.js
          grep -Fq '__luminaCurrentUserMarker' drive-assistant/poi-enhanced.js
          grep -Fq 'active-map' drive-assistant/poi-enhanced.js
          grep -Fq 'photon.komoot.io/api/' drive-assistant/navigation-search.js
          grep -Fq "countrycodes','gr'" drive-assistant/navigation-search.js
          grep -Fq 'luminaConfirmed' drive-assistant/navigation-search.js
          grep -Fq 'stopImmediatePropagation' drive-assistant/navigation-search.js
          grep -Fq 'mergeAndRank' drive-assistant/navigation-search.js
          grep -Fq "updateViaCache:'none'" drive-assistant/index.html
          grep -Fq 'router.project-osrm.org' drive-assistant/app-v2.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.stamp.outputs.source_sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - id: stamp
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ needs.validate.outputs.source_sha }}"
          printf '%s\n' "$SOURCE_SHA" > drive-assistant/build.txt
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > drive-assistant/deployed-at.txt
          printf '%s\n' "feature/lumina-drive-assistant/drive-assistant" > drive-assistant/deploy-source.txt
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: drive-assistant
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify live search recovery
        env:
          EXPECTED_SHA: ${{ needs.deploy.outputs.source_sha }}
          BASE_URL: https://koulierakis.github.io/lumina-ai-studio
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            LIVE_SHA="$(curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/build.txt?verify=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/navigation-search.js?verify=${GITHUB_RUN_ID}" -o /tmp/navigation-search.js
          curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/poi-enhanced.js?verify=${GITHUB_RUN_ID}" -o /tmp/poi-enhanced.js
          curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/ui-fixes.css?verify=${GITHUB_RUN_ID}" -o /tmp/ui-fixes.css
          grep -Fq 'photon.komoot.io/api/' /tmp/navigation-search.js
          grep -Fq "countrycodes','gr'" /tmp/navigation-search.js
          grep -Fq 'luminaConfirmed' /tmp/navigation-search.js
          grep -Fq 'stopImmediatePropagation' /tmp/navigation-search.js
          grep -Fq 'mergeAndRank' /tmp/navigation-search.js
          grep -Fq '__luminaCurrentUserMarker' /tmp/poi-enhanced.js
          grep -Fq '.home-toolbar' /tmp/ui-fixes.css
          node --check /tmp/navigation-search.js
          node --check /tmp/poi-enhanced.js

  record-result:
    if: ${{ always() }}
    needs: [validate, deploy, verify-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/milestone1-pdf-docx-engine
      - name: Record result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-production.result }}
          SOURCE_SHA: ${{ needs.deploy.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "LUMINA Production Verifier"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .production-verification
          printf '%s\n' "${SOURCE_SHA:-unknown}" > .production-verification/build.txt
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .production-verification/verified-at.txt
          printf '%s\n' "https://koulierakis.github.io/lumina-ai-studio/" > .production-verification/live-url.txt
          printf 'validate=%s\ndeploy=%s\nverify=%s\n' "$VALIDATE_RESULT" "$DEPLOY_RESULT" "$VERIFY_RESULT" > .production-verification/results.txt
          if [ "$VALIDATE_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$VERIFY_RESULT" = success ]; then printf '%s\n' PASS > .production-verification/status.txt; else printf '%s\n' FAIL > .production-verification/status.txt; fi
          git add .production-verification
          git commit -m "chore(drive): record production verification [skip ci]" || exit 0
          git push origin HEAD:feature/milestone1-pdf-docx-engine
