name: LUMINA Drive Production

on:
  push:
    branches:
      - feature/lumina-drive-assistant
    paths:
      - "drive-assistant/**"
      - ".github/workflows/drive-assistant-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lumina-drive-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Drive source
        run: |
          set -euo pipefail
          for f in index.html app-v2.js navigation-search.js shared-gps.js route-selection-bridge.js poi-catalog.js poi-enhanced.js mapbox-poi-v2.js google-places.js google-key-settings.js map-poi-layer.js map-labels.js address-autocomplete.js drive-completion.js session-bootstrap.js road-safety.js sw.js manifest.webmanifest ui-fixes.css premium-v52.css voice-command-guard.js tests/production-smoke.mjs; do test -s "drive-assistant/$f"; done
          for f in app-v2.js navigation-search.js shared-gps.js route-selection-bridge.js poi-catalog.js poi-enhanced.js mapbox-poi-v2.js google-places.js google-key-settings.js map-poi-layer.js map-labels.js address-autocomplete.js drive-completion.js road-safety.js overpass-fallback.js walking-router.js map-fallback.js user-marker-hook.js reverse-geocode-fallback.js session-bootstrap.js sw.js voice-command-guard.js; do node --check "drive-assistant/$f"; done
          grep -Eq 'google-places\.js\?v=[0-9]+' drive-assistant/index.html
          grep -Eq 'google-key-settings\.js\?v=[0-9]+' drive-assistant/index.html
          grep -Eq 'navigation-search\.js\?v=[0-9]+' drive-assistant/index.html
          grep -Eq 'voice-command-guard\.js\?v=[0-9]+' drive-assistant/index.html
          grep -Eq 'mapbox-poi-v2\.js\?v=[0-9]+' drive-assistant/index.html
          grep -Fq 'if(!key)return false' drive-assistant/mapbox-poi-v2.js
          grep -Eq 'lumina-drive-cache-reset-v[0-9]+' drive-assistant/index.html
          grep -Eq "const CACHE='lumina-drive-v[0-9]+'" drive-assistant/sw.js
          grep -Fq "provider('ArcGIS'" drive-assistant/navigation-search.js
          grep -Fq "provider('Nominatim'" drive-assistant/navigation-search.js
          grep -Fq "provider('Photon'" drive-assistant/navigation-search.js
          grep -Fq "provider('OSM POI'" drive-assistant/navigation-search.js
          grep -Fq 'LuminaGooglePlaces.textSearch' drive-assistant/navigation-search.js
          grep -Fq 'Place.searchByText' drive-assistant/google-places.js
          grep -Fq 'Place.searchNearby' drive-assistant/google-places.js
          grep -Fq 'if (window.LuminaNameNavigation) return;' drive-assistant/address-autocomplete.js
          grep -Fq 'getLastFix?.(8000)' drive-assistant/voice-command-guard.js
          grep -Fq 'Hands-free ενεργό' drive-assistant/voice-command-guard.js
      - name: Live provider regression smoke
        run: node drive-assistant/tests/production-smoke.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject production Mapbox configuration
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAPBOX_ACCESS_TOKEN"
          node - <<'NODE'
          const fs = require('fs');
          const token = process.env.MAPBOX_ACCESS_TOKEN;
          fs.writeFileSync('drive-assistant/runtime-config.js', `window.__LUMINA_CONFIG__=Object.assign({},window.__LUMINA_CONFIG__||{},{mapboxAccessToken:${JSON.stringify(token)}});\n`);
          let html = fs.readFileSync('drive-assistant/index.html','utf8');
          html = html.replace('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>', '<script src="runtime-config.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>');
          fs.writeFileSync('drive-assistant/index.html', html);
          NODE
      - name: Stamp build
        run: |
          printf '%s\n' "$(git rev-parse HEAD)" > drive-assistant/build.txt
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > drive-assistant/deployed-at.txt
          printf '%s\n' "feature/lumina-drive-assistant/drive-assistant" > drive-assistant/deploy-source.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: drive-assistant
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify live LUMINA Drive assets
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
          BASE_URL: https://koulierakis.github.io/lumina-ai-studio
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            LIVE_SHA="$(curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/build.txt?verify=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          for f in index.html navigation-search.js address-autocomplete.js google-places.js google-key-settings.js poi-enhanced.js mapbox-poi-v2.js overpass-fallback.js sw.js voice-command-guard.js deploy-source.txt runtime-config.js; do curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/$f?verify=${GITHUB_RUN_ID}" -o "/tmp/${f}"; done
          grep -Eq 'google-places\.js\?v=[0-9]+' /tmp/index.html
          grep -Eq 'google-key-settings\.js\?v=[0-9]+' /tmp/index.html
          grep -Eq 'voice-command-guard\.js\?v=[0-9]+' /tmp/index.html
          grep -Eq 'mapbox-poi-v2\.js\?v=[0-9]+' /tmp/index.html
          grep -Fq 'runtime-config.js' /tmp/index.html
          grep -Fq 'mapboxAccessToken' /tmp/runtime-config.js
          grep -Fq 'if(!key)return false' /tmp/mapbox-poi-v2.js
          grep -Fq "provider('OSM POI'" /tmp/navigation-search.js
          grep -Fq 'LuminaGooglePlaces.textSearch' /tmp/navigation-search.js
          grep -Fq 'Place.searchByText' /tmp/google-places.js
          grep -Fq 'getLastFix?.(8000)' /tmp/voice-command-guard.js
          grep -Fxq 'feature/lumina-drive-assistant/drive-assistant' /tmp/deploy-source.txt
          node --check /tmp/navigation-search.js
          node --check /tmp/address-autocomplete.js
          node --check /tmp/google-places.js
          node --check /tmp/poi-enhanced.js
          node --check /tmp/mapbox-poi-v2.js
          node --check /tmp/voice-command-guard.js
