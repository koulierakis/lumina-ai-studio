# LUMINA Drive GitHub Pages deployment
name: LUMINA Drive Assistant
on:
  push:
    branches: [feature/lumina-drive-assistant]
    paths: ["drive-assistant/**", ".github/workflows/drive-assistant-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lumina-drive-pages
  cancel-in-progress: true
jobs:
  validate:
    name: Validate LUMINA Drive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify core files
        run: |
          test -s drive-assistant/index.html
          test -s drive-assistant/styles.css
          test -s drive-assistant/app-v2.js
          test -s drive-assistant/drive-completion.js
          test -s drive-assistant/road-safety.js
          test -s drive-assistant/overpass-fallback.js
          test -s drive-assistant/walking-router.js
          test -s drive-assistant/session-bootstrap.js
          test -s drive-assistant/poi-catalog.js
          test -s drive-assistant/manifest.webmanifest
          test -s drive-assistant/sw.js
      - name: JavaScript syntax check
        run: |
          for f in app-v2.js drive-completion.js road-safety.js overpass-fallback.js walking-router.js poi-catalog.js address-autocomplete.js map-labels.js map-fallback.js user-marker-hook.js reverse-geocode-fallback.js session-bootstrap.js sw.js; do node --check "drive-assistant/$f"; done
      - name: Required mobile feature smoke checks
        run: |
          grep -q 'navigator.geolocation' drive-assistant/app-v2.js
          grep -q 'speechSynthesis' drive-assistant/app-v2.js
          grep -q 'SpeechRecognition' drive-assistant/app-v2.js
          grep -q 'router.project-osrm.org' drive-assistant/app-v2.js
          grep -q 'api.open-meteo.com' drive-assistant/app-v2.js
          grep -q 'autoReroute' drive-assistant/app-v2.js
          grep -q 'wakeLock' drive-assistant/app-v2.js
          grep -q 'window.LuminaWalkingRouter' drive-assistant/walking-router.js
          grep -q 'highway=construction' drive-assistant/road-safety.js
          grep -q 'railway=level_crossing' drive-assistant/road-safety.js
          grep -q '\[hazard\]' drive-assistant/road-safety.js
          grep -q 'applyConfidentSpeedLimit' drive-assistant/road-safety.js
          grep -q 'Χαρτογραφημένη επικίνδυνη στροφή' drive-assistant/road-safety.js
          grep -q 'routeSelectedDestination' drive-assistant/address-autocomplete.js
          grep -q 'selectedLat' drive-assistant/address-autocomplete.js
          grep -q 'normalizeFreeDriveButton' drive-assistant/drive-completion.js
          grep -q 'getCurrentPosition' drive-assistant/poi-catalog.js
          grep -q 'RADIUS_M=6000' drive-assistant/poi-catalog.js
          grep -q 'seenOsmIds' drive-assistant/poi-catalog.js
          grep -q 'distanceMeters(existing.point,item.point)<120' drive-assistant/poi-catalog.js
          grep -q 'https://www.google.com/maps/dir/' drive-assistant/poi-catalog.js
          grep -q "travelmode','driving" drive-assistant/poi-catalog.js
          grep -q 'Δεν βρέθηκαν καταστήματα κοντά σας. Δοκιμάστε να αυξήσετε την ακτίνα.' drive-assistant/poi-catalog.js
          grep -q 'overpass.kumi.systems' drive-assistant/poi-catalog.js
          grep -q 'overpass.nchc.org.tw' drive-assistant/poi-catalog.js
          grep -q 'overpass.kumi.systems' drive-assistant/overpass-fallback.js
          grep -q 'overpass.nchc.org.tw' drive-assistant/overpass-fallback.js
          grep -q 'overpass-fallback.js?v=31' drive-assistant/index.html
          grep -q 'poi-catalog.js?v=31' drive-assistant/index.html
          grep -q 'road-safety.js?v=31' drive-assistant/index.html
          grep -q 'drive-completion.js?v=31' drive-assistant/index.html
          grep -q "lumina-drive-v31" drive-assistant/sw.js
          grep -q "overpass-fallback.js?v=31" drive-assistant/sw.js
          grep -q "poi-catalog.js?v=31" drive-assistant/sw.js
          grep -q "road-safety.js?v=31" drive-assistant/sw.js
          grep -q "cache:'no-store'" drive-assistant/sw.js
  deploy:
    name: Deploy LUMINA Drive to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp deployed build
        env: {BUILD_VERSION: "${{ github.sha }}"}
        run: printf '%s\n' "$BUILD_VERSION" > drive-assistant/build.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: drive-assistant}
      - id: deployment
        uses: actions/deploy-pages@v4