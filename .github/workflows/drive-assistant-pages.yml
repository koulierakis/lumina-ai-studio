name: LUMINA Drive Production
# deployment-trigger: v53-cache-bust-mobile-assets

on:
  push:
    branches:
      - feature/milestone1-pdf-docx-engine
    paths:
      - ".github/workflows/drive-assistant-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lumina-drive-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Drive production source
        run: |
          set -euo pipefail
          for f in index.html app-v2.js navigation-search.js shared-gps.js route-selection-bridge.js poi-catalog.js poi-enhanced.js google-places.js google-key-settings.js map-poi-layer.js map-labels.js address-autocomplete.js drive-completion.js session-bootstrap.js road-safety.js sw.js manifest.webmanifest ui-fixes.css premium-v52.css tests/production-smoke.mjs; do test -s "drive-assistant/$f"; done
          for f in app-v2.js navigation-search.js shared-gps.js route-selection-bridge.js poi-catalog.js poi-enhanced.js google-places.js google-key-settings.js map-poi-layer.js map-labels.js address-autocomplete.js drive-completion.js road-safety.js overpass-fallback.js walking-router.js map-fallback.js user-marker-hook.js reverse-geocode-fallback.js session-bootstrap.js sw.js; do node --check "drive-assistant/$f"; done
          grep -Fq 'map-poi-layer.js?v=53' drive-assistant/index.html
          grep -Fq 'map-labels.js?v=53' drive-assistant/index.html
          grep -Fq 'navigation-search.js?v=53' drive-assistant/index.html
          grep -Fq 'premium-v52.css?v=53' drive-assistant/index.html
          grep -Fq 'lumina-drive-cache-reset-v53' drive-assistant/index.html
          grep -Fq "const CACHE='lumina-drive-v53'" drive-assistant/sw.js
          grep -Fq 'Place.searchByText' drive-assistant/google-places.js
          grep -Fq 'Place.searchNearby' drive-assistant/google-places.js
          grep -Fq 'LuminaGooglePlaces.textSearch' drive-assistant/navigation-search.js
          grep -Fq 'RADII=[750,1500,3000,6000,12000]' drive-assistant/google-places.js
          grep -Fq 'RADII=[750,1500,2500,5000,10000]' drive-assistant/poi-enhanced.js
          grep -Fq 'Google + OpenStreetMap' drive-assistant/poi-enhanced.js
          grep -Fq 'if(z<13' drive-assistant/map-labels.js
          grep -Fq 'road-local' drive-assistant/map-labels.js
          grep -Fq 'z>=18?140' drive-assistant/map-labels.js
          grep -Fq 'maneuver-symbol' drive-assistant/drive-completion.js
          grep -Fq 'slightRight' drive-assistant/drive-completion.js
          grep -Fq 'overpass.openstreetmap.fr' drive-assistant/poi-enhanced.js
          grep -Fq 'overpass.private.coffee' drive-assistant/overpass-fallback.js
          grep -Fq 'maps.mail.ru/osm/tools/overpass' drive-assistant/poi-catalog.js
          grep -Fq 'MIN_ZOOM=15' drive-assistant/map-poi-layer.js
          grep -Fq 'SpeechRecognition' drive-assistant/app-v2.js
          grep -Fq 'drive-vector-icon' drive-assistant/drive-completion.js
      - name: Live provider regression smoke
        run: node drive-assistant/tests/production-smoke.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.stamp.outputs.source_sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lumina-drive-assistant
      - id: stamp
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ needs.validate.outputs.source_sha }}"
          printf '%s\n' "$SOURCE_SHA" > drive-assistant/build.txt
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > drive-assistant/deployed-at.txt
          printf '%s\n' "feature/lumina-drive-assistant/drive-assistant" > drive-assistant/deploy-source.txt
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: drive-assistant
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify live LUMINA Drive assets
        env:
          EXPECTED_SHA: ${{ needs.deploy.outputs.source_sha }}
          BASE_URL: https://koulierakis.github.io/lumina-ai-studio
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            LIVE_SHA="$(curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/build.txt?verify=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          for f in index.html drive-completion.js navigation-search.js google-places.js google-key-settings.js map-poi-layer.js map-labels.js poi-catalog.js poi-enhanced.js overpass-fallback.js premium-v52.css sw.js deploy-source.txt; do curl -fsS -H 'Cache-Control: no-cache' "$BASE_URL/$f?verify=${GITHUB_RUN_ID}" -o "/tmp/${f}"; done
          grep -Fq 'map-poi-layer.js?v=53' /tmp/index.html
          grep -Fq 'map-labels.js?v=53' /tmp/index.html
          grep -Fq 'navigation-search.js?v=53' /tmp/index.html
          grep -Fq 'premium-v52.css?v=53' /tmp/index.html
          grep -Fq 'lumina-drive-cache-reset-v53' /tmp/index.html
          grep -Fq 'maneuver-symbol' /tmp/drive-completion.js
          grep -Fq 'slightRight' /tmp/drive-completion.js
          grep -Fq 'if(z<13' /tmp/map-labels.js
          grep -Fq 'road-local' /tmp/map-labels.js
          grep -Fq 'z>=18?140' /tmp/map-labels.js
          grep -Fq 'Google + OpenStreetMap' /tmp/poi-enhanced.js
          grep -Fq 'Place.searchByText' /tmp/google-places.js
          grep -Fq 'Place.searchNearby' /tmp/google-places.js
          grep -Fq 'LuminaGooglePlaces.textSearch' /tmp/navigation-search.js
          grep -Fq 'overpass.private.coffee' /tmp/overpass-fallback.js
          grep -Fq "const CACHE='lumina-drive-v53'" /tmp/sw.js
          grep -Fxq 'feature/lumina-drive-assistant/drive-assistant' /tmp/deploy-source.txt
          node --check /tmp/drive-completion.js
          node --check /tmp/navigation-search.js
          node --check /tmp/google-places.js
          node --check /tmp/poi-enhanced.js
          node --check /tmp/map-labels.js

  record-result:
    if: ${{ always() }}
    needs: [validate, deploy, verify-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/milestone1-pdf-docx-engine
      - name: Record result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-production.result }}
          SOURCE_SHA: ${{ needs.deploy.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "LUMINA Production Verifier"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .production-verification
          printf '%s\n' "${SOURCE_SHA:-unknown}" > .production-verification/build.txt
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .production-verification/verified-at.txt
          printf '%s\n' "https://koulierakis.github.io/lumina-ai-studio/" > .production-verification/live-url.txt
          printf 'validate=%s\ndeploy=%s\nverify=%s\n' "$VALIDATE_RESULT" "$DEPLOY_RESULT" "$VERIFY_RESULT" > .production-verification/results.txt
          if [ "$VALIDATE_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$VERIFY_RESULT" = success ]; then printf '%s\n' PASS > .production-verification/status.txt; else printf '%s\n' FAIL > .production-verification/status.txt; fi
          git add .production-verification
          git commit -m "chore(drive): record production verification [skip ci]" || exit 0
          git push origin HEAD:feature/milestone1-pdf-docx-engine
