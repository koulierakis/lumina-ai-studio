name: LUMINA Full Test Pipeline

on:
  push:
    branches:
      - work/documents-mind-completion
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run deterministic backend suite
        working-directory: backend
        run: pytest -q tests --ignore=tests/runtime_validate_code_builder_7b.py --ignore=tests/runtime_validate_openhands_10_tasks.py --ignore=tests/runtime_validate_openhands_api.py --ignore=tests/runtime_validate_openhands_apply_rollback.py --ignore=tests/runtime_validate_openhands_code_builder.py --ignore=tests/runtime_validate_openhands_reliability.py

  frontend:
    name: Frontend Jest and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --runInBand
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  drive-assistant:
    name: Drive Assistant gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic Drive Assistant validation
        run: |
          node drive-assistant/tests/mobile-feature-gate.mjs
          node drive-assistant/tests/mobile-lifecycle-gate.mjs
          node drive-assistant/tests/runtime-validate.mjs

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
