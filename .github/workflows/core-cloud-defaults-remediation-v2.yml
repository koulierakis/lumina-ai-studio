name: Core Cloud Defaults Remediation V2

on:
  push:
    branches:
      - work/platform-auth-five-fixes-20260911
    paths:
      - .github/workflows/core-cloud-defaults-remediation-v2.yml

permissions:
  contents: write

jobs:
  remediate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Verify baseline ancestry
        run: git merge-base --is-ancestor 4b01fa7b207bc13b2953718c818ec3856e4d185d HEAD

      - name: Apply targeted remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path); text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'{path}: missing anchor {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count}, found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: {found} replacement(s)')

          # Voice: real Edge TTS default; mock remains explicit-only.
          replace('backend/server.py', 'os.environ.get("VOICE_PROVIDER", "mock")', 'os.environ.get("VOICE_PROVIDER", "edge-tts")')

          # Document Studio: Groq cloud primary and current free-tier model.
          replace('backend/document_studio/generation_orchestrator.py', 'DEFAULT_PROVIDER = "ollama"', 'DEFAULT_PROVIDER = "groq"', 1)
          replace('backend/document_studio/groq_provider.py', 'DEFAULT_GROQ_MODEL = "openai/gpt-oss-120b"', 'DEFAULT_GROQ_MODEL = "llama-3.3-70b-versatile"', 1)

          # Preserve explicit dependency injection: a one-provider custom registry is authoritative.
          p = Path('backend/document_studio/generation_orchestrator.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''    def get(self, name: str | None = None) -> DocumentAIProvider:\n'''
          method = '''    def injected_names(self) -> tuple[str, ...]:\n        return tuple(self._providers)\n\n'''
          if anchor not in text: raise SystemExit('generation_orchestrator.py registry anchor missing')
          text = text.replace(anchor, method + anchor, 1)
          old = '''    provider_registry = registry or DocumentAIProviderRegistry()\n    requested_name = (provider_name or DEFAULT_PROVIDER).strip().casefold()\n    primary = provider_registry.get(requested_name)\n'''
          new = '''    provider_registry = registry or DocumentAIProviderRegistry()\n    requested_name = (provider_name or DEFAULT_PROVIDER).strip().casefold()\n    if provider_name is None and registry is not None:\n        injected_names = provider_registry.injected_names()\n        if requested_name not in injected_names and len(injected_names) == 1:\n            requested_name = injected_names[0]\n    primary = provider_registry.get(requested_name)\n'''
          if old not in text: raise SystemExit('generation_orchestrator.py selection anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Update tests whose purpose is to assert the intentional default contract.
          p = Path('backend/tests/test_generation_orchestration.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('"model": "openai/gpt-oss-120b"', '"model": "llama-3.3-70b-versatile"')
          text = text.replace('assert DEFAULT_PROVIDER == "ollama"', 'assert DEFAULT_PROVIDER == "groq"', 1)
          text = text.replace('assert registry.get() is ollama', 'assert registry.get() is groq', 1)
          p.write_text(text, encoding='utf-8')

          # Advisor: add Groq cloud inference.
          p = Path('backend/ai_runtime/advisor.py'); text = p.read_text(encoding='utf-8')
          old = '''    def openai_configured(self) -> bool:\n        return bool(os.environ.get("OPENAI_API_KEY", "").strip())\n'''
          new = '''    def openai_configured(self) -> bool:\n        return bool(os.environ.get("OPENAI_API_KEY", "").strip())\n\n    def groq_model_name(self) -> str:\n        return os.environ.get("LUMINA_GROQ_MODEL", "llama-3.3-70b-versatile").strip() or "llama-3.3-70b-versatile"\n\n    def groq_configured(self) -> bool:\n        return bool(os.environ.get("GROQ_API_KEY", "").strip())\n'''
          if old not in text: raise SystemExit('advisor openai anchor missing')
          text = text.replace(old, new, 1)
          ask_anchor = '''    async def ask(self, owner: str, request: AdvisorRequest) -> dict[str, Any]:\n'''
          groq_method = '''    async def _ask_groq(self, *, messages: list[dict[str, str]]) -> tuple[str, list[dict[str, str]], str]:\n        api_key = os.environ.get("GROQ_API_KEY", "").strip()\n        if not api_key:\n            raise RuntimeError("GROQ_API_KEY is not configured")\n        model = self.groq_model_name()\n        payload = {"model": model, "messages": messages, "temperature": 0.2}\n        timeout = httpx.Timeout(connect=10.0, read=120.0, write=30.0, pool=10.0)\n        async with httpx.AsyncClient(timeout=timeout, trust_env=False) as client:\n            response = await client.post(\n                "https://api.groq.com/openai/v1/chat/completions",\n                headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},\n                json=payload,\n            )\n        if response.status_code < 200 or response.status_code >= 300:\n            raise RuntimeError(f"Groq API returned HTTP {response.status_code}: {response.text[:500]}")\n        data = response.json()\n        try:\n            answer = str(data["choices"][0]["message"]["content"]).strip()\n        except (KeyError, IndexError, TypeError) as exc:\n            raise RuntimeError("Groq API returned no output text") from exc\n        if not answer:\n            raise RuntimeError("Groq API returned no output text")\n        return answer, [], model\n\n'''
          if ask_anchor not in text: raise SystemExit('advisor ask anchor missing')
          text = text.replace(ask_anchor, groq_method + ask_anchor, 1)
          old = '''        requested_provider = request.provider.strip().casefold()\n        if requested_provider not in {"auto", "local", "openai"}:\n            requested_provider = "auto"\n        use_openai = requested_provider == "openai" or request.web_research\n        if requested_provider == "auto" and not request.web_research:\n            use_openai = False\n\n        started = time.monotonic()\n        sources: list[dict[str, str]] = []\n        error = None\n        if use_openai:\n'''
          new = '''        requested_provider = request.provider.strip().casefold()\n        if requested_provider not in {"auto", "local", "groq", "openai"}:\n            requested_provider = "auto"\n        use_openai = requested_provider == "openai" or request.web_research\n        use_groq = requested_provider == "groq" or (requested_provider == "auto" and not request.web_research and self.groq_configured())\n\n        started = time.monotonic()\n        sources: list[dict[str, str]] = []\n        error = None\n        if use_groq:\n            try:\n                answer, sources, model = await self._ask_groq(messages=messages)\n                provider = "groq"\n                provider_status = "ok"\n            except Exception as exc:\n                answer = "Groq cloud mode is currently unavailable. Check GROQ_API_KEY, rate limits, network access, and the configured model, then retry or switch provider."\n                model = self.groq_model_name()\n                provider = "groq"\n                provider_status = "unavailable"\n                error = str(exc)\n        elif use_openai:\n'''
          if old not in text: raise SystemExit('advisor provider selection anchor missing')
          text = text.replace(old, new, 1)
          old = '''            "available": health.available or self.openai_configured(),\n            "local_available": health.available,\n            "openai_configured": self.openai_configured(),\n            "model": model,\n            "openai_model": self.openai_model_name(),\n'''
          new = '''            "available": health.available or self.groq_configured() or self.openai_configured(),\n            "local_available": health.available,\n            "groq_configured": self.groq_configured(),\n            "openai_configured": self.openai_configured(),\n            "model": model,\n            "groq_model": self.groq_model_name(),\n            "openai_model": self.openai_model_name(),\n'''
          if old not in text: raise SystemExit('advisor status anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Advisor frontend default + explicit Groq selector/preflight.
          p = Path('frontend/src/pages/ExecutiveAdvisor.jsx'); text = p.read_text(encoding='utf-8')
          if "const [provider, setProvider] = useState('local');" not in text: raise SystemExit('frontend provider default anchor missing')
          text = text.replace("const [provider, setProvider] = useState('local');", "const [provider, setProvider] = useState('groq');", 1)
          old = "if ((provider === 'openai' || webResearch) && !status?.openai_configured) {\n      setError('Cloud/Web Research requires OPENAI_API_KEY in the backend environment.');\n      return;\n    }"
          new = "if (provider === 'groq' && !status?.groq_configured) {\n      setError('Groq requires GROQ_API_KEY in the backend environment.');\n      return;\n    }\n    if ((provider === 'openai' || webResearch) && !status?.openai_configured) {\n      setError('Cloud/Web Research requires OPENAI_API_KEY in the backend environment.');\n      return;\n    }"
          if old not in text: raise SystemExit('frontend provider preflight anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace("${status?.openai_configured ? 'bg-emerald-400' : 'bg-white/20'}`}>Cloud", "${status?.groq_configured || status?.openai_configured ? 'bg-emerald-400' : 'bg-white/20'}`}>Cloud", 1)
          local_btn = "<button onClick={() => { setProvider('local'); setWebResearch(false); }} className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-[11px] ${provider === 'local' && !webResearch ? 'border-emerald-400/30 bg-emerald-400/5 text-emerald-200' : 'border-white/10 text-white/35'}`}><HardDrive className=\"h-3.5 w-3.5\" />Local</button>"
          if local_btn not in text: raise SystemExit('frontend local button anchor missing')
          groq_btn = "<button onClick={() => { setProvider('groq'); setWebResearch(false); }} className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-[11px] ${provider === 'groq' && !webResearch ? 'border-sky-400/30 bg-sky-400/5 text-sky-200' : 'border-white/10 text-white/35'}`}><Cloud className=\"h-3.5 w-3.5\" />Groq</button>"
          p.write_text(text.replace(local_btn, groq_btn + "\n                " + local_btn, 1), encoding='utf-8')

          # Image provider truth + Cloudflare provider registration.
          replace('backend/providers/manager.py', 'DEFAULT_ORDER = "flux,comfyui,fal,bfl,replicate,openai,gemini,local"', 'DEFAULT_ORDER = "cloudflare,flux,comfyui,fal,bfl,replicate,openai,gemini,local"', 1)
          replace('backend/providers/manager.py', 'PUBLIC_NO_CREDENTIAL_PROVIDERS = {"flux"}', 'PUBLIC_NO_CREDENTIAL_PROVIDERS: set[str] = set()', 1)
          p = Path('backend/providers/__init__.py'); text = p.read_text(encoding='utf-8')
          text = text.replace('from .comfyui_provider import ComfyUIProvider\n', 'from .comfyui_provider import ComfyUIProvider\nfrom .cloudflare_provider import CloudflareFluxProvider\n', 1)
          text = text.replace('_REGISTRY: Dict[str, Type[ImageProvider]] = {\n    "flux": FluxHFProvider,', '_REGISTRY: Dict[str, Type[ImageProvider]] = {\n    "cloudflare": CloudflareFluxProvider,\n    "flux": FluxHFProvider,', 1)
          p.write_text(text, encoding='utf-8')

          Path('backend/providers/cloudflare_provider.py').write_text('''"""Cloudflare Workers AI FLUX.1 Schnell image provider."""\nfrom __future__ import annotations\nimport asyncio\nimport base64\nimport os\nimport httpx\nfrom .base import ErrorKind, GeneratedImage, GenerationInput, ImageProvider, ProviderCapabilities, ProviderError, ProviderInvalidResponseError\n\nMODEL = "@cf/black-forest-labs/flux-1-schnell"\n\nclass CloudflareFluxProvider(ImageProvider):\n    name = "cloudflare"\n    priority = 4\n    capabilities = ProviderCapabilities(generation=True, editing=False, identity_references=False, masks=False, multiple_outputs=True, aspect_ratios=("1:1",), models=(MODEL,), maximum_reference_images=0, maximum_outputs=4)\n\n    @classmethod\n    def is_configured(cls) -> bool:\n        return bool(os.getenv("CLOUDFLARE_API_TOKEN", "").strip() and os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip())\n\n    async def _one(self, spec: GenerationInput, seed: int | None) -> GeneratedImage:\n        token = os.getenv("CLOUDFLARE_API_TOKEN", "").strip(); account_id = os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip()\n        if not token or not account_id:\n            raise ProviderError(self.name, "Cloudflare Workers AI credentials are not configured.", kind=ErrorKind.AUTH, safe_message="Cloudflare Workers AI is not configured.")\n        if spec.reference_images:\n            raise ProviderError(self.name, "Reference images are unsupported.", kind=ErrorKind.UNSUPPORTED, safe_message="Cloudflare FLUX.1 Schnell supports text-to-image only.")\n        payload = {"prompt": spec.prompt.strip(), "steps": 4}\n        if seed is not None: payload["seed"] = int(seed)\n        url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/{MODEL}"\n        try:\n            async with httpx.AsyncClient(timeout=httpx.Timeout(connect=10.0, read=120.0, write=30.0, pool=10.0), trust_env=False) as client:\n                response = await client.post(url, headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}, json=payload)\n        except httpx.TimeoutException as exc:\n            raise ProviderError(self.name, str(exc), kind=ErrorKind.TIMEOUT, retryable=True, safe_message="Cloudflare image generation timed out.") from exc\n        except httpx.HTTPError as exc:\n            raise ProviderError(self.name, str(exc), kind=ErrorKind.UNAVAILABLE, retryable=True, safe_message="Cloudflare Workers AI is temporarily unavailable.") from exc\n        if not 200 <= response.status_code < 300:\n            kind = ErrorKind.AUTH if response.status_code in {401, 403} else ErrorKind.RATE_LIMIT if response.status_code == 429 else ErrorKind.UNAVAILABLE\n            raise ProviderError(self.name, f"Cloudflare HTTP {response.status_code}", kind=kind, retryable=response.status_code in {429,500,502,503,504}, status_code=response.status_code, safe_message="Cloudflare Workers AI could not complete the image request.")\n        try:\n            envelope = response.json(); result = envelope.get("result", envelope) if isinstance(envelope, dict) else {}; encoded = result.get("image") if isinstance(result, dict) else None; data = base64.b64decode(encoded, validate=True)\n        except Exception as exc:\n            raise ProviderInvalidResponseError(self.name, "Cloudflare returned an invalid image response.") from exc\n        if not data: raise ProviderInvalidResponseError(self.name, "Cloudflare returned an empty image.")\n        return GeneratedImage(data=data, mime_type="image/jpeg")\n\n    async def generate(self, spec: GenerationInput) -> list[GeneratedImage]:\n        if spec.mode not in {"text-to-image", "generate", ""}: raise ProviderError(self.name, "Unsupported mode.", kind=ErrorKind.UNSUPPORTED)\n        if not spec.prompt.strip(): raise ProviderError(self.name, "Prompt is required.", kind=ErrorKind.INVALID_REQUEST)\n        count = max(1, min(int(spec.count or 1), self.capabilities.maximum_outputs))\n        return await asyncio.gather(*(self._one(spec, None if spec.seed is None else int(spec.seed) + i) for i in range(count)))\n''', encoding='utf-8')

          p = Path('backend/.env.example'); text = p.read_text(encoding='utf-8')
          if 'CLOUDFLARE_API_TOKEN=' not in text:
              text += '\n# Cloudflare Workers AI (Image Studio FLUX)\nCLOUDFLARE_API_TOKEN=\nCLOUDFLARE_ACCOUNT_ID=\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Compile changed backend files
        run: |
          python -m py_compile backend/server.py backend/ai_runtime/advisor.py backend/document_studio/generation_orchestrator.py backend/document_studio/groq_provider.py backend/providers/manager.py backend/providers/cloudflare_provider.py backend/providers/__init__.py

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run targeted backend tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find backend/tests -maxdepth 1 -type f \( -name 'test_voice*.py' -o -name 'test_document_studio*.py' -o -name 'test_generation_orchestration.py' -o -name 'test_*advisor*.py' -o -name 'test_*provider*.py' -o -name 'test_identity_packs.py' \) | sort -u)
          PYTHONPATH=backend python -m pytest -q "${TESTS[@]}"

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit tested changes and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/core-cloud-defaults-remediation.yml .github/workflows/core-cloud-defaults-remediation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cloud): use real cloud providers by default"
          git push origin HEAD:work/platform-auth-five-fixes-20260911
