name: Apply Proposal Content Preservation

on:
  push:
    branches:
      - work/lumina-master-completion
    paths:
      - 'ops/preserve-proposed-file-content.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      LUMINA_SKIP_TEST_SERVER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/lumina-master-completion
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded model migration
        run: python ops/preserve-proposed-file-content.py
      - name: Compile model and proposal bridge
        run: python -m py_compile backend/code_builder/models.py backend/code_builder/openhands_proposal_service.py
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist pydantic fastapi httpx
      - name: Run exact-content regression test
        working-directory: backend
        run: python -m pytest -q tests/test_openhands_proposal_service.py
      - name: Commit validated model fix
        run: |
          if git diff --quiet -- backend/code_builder/models.py; then
            echo 'No model changes required.'
            exit 0
          fi
          git config user.name 'LUMINA Completion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/code_builder/models.py
          git commit -m 'Preserve exact file content in Code Builder proposals'
          git push origin HEAD:work/lumina-master-completion
