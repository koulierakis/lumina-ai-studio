name: code-builder-review-layer
on:
  push:
    branches:
      - work/code-builder-complete
    paths:
      - .github/workflows/code-builder-review-layer.yml
permissions:
  contents: write
jobs:
  harden-review-verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/code-builder-complete
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harden verdict parser
        shell: python
        run: |
          from pathlib import Path

          router = Path("backend/code_builder/router.py")
          text = router.read_text(encoding="utf-8")
          old = '''    normalized = str(content).strip()\n    upper = normalized.upper()\n    verdict = (\n        "block"\n        if "BLOCK" in upper\n        else "warn"\n        if "WARN" in upper\n        else "pass"\n    )\n'''
          new = '''    normalized = str(content).strip()\n    first_line = (\n        normalized.splitlines()[0].strip().upper()\n        if normalized\n        else ""\n    )\n    verdict = (\n        "block"\n        if first_line.startswith("BLOCK")\n        else "warn"\n        if first_line.startswith("WARN")\n        else "pass"\n        if first_line.startswith("PASS")\n        else "warn"\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("Reviewer verdict parser anchor not found exactly once")
          router.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("backend/tests/test_code_builder_transaction_boundary.py")
          test_text = tests.read_text(encoding="utf-8")
          addition = '''\n\ndef test_ai_review_does_not_treat_negated_block_word_as_block(tmp_path: Path) -> None:\n    class PassReviewOllamaService:\n        model = "review-test-model"\n\n        def analyze_code_task(self, **_kwargs):\n            return "PASS: No BLOCK issues were found in the prepared patch."\n\n    relative = "backend/review_verdict.py"\n    (tmp_path / "backend").mkdir()\n    payload = TaskCreateRequest(\n        instruction="Review verdict parsing.",\n        require_approval=True,\n        auto_start_after_approval=False,\n        build_policy=BuildPolicy.DISABLED,\n    )\n    service = make_service(tmp_path, relative)\n    service._ollama_service = PassReviewOllamaService()\n    request = _task_request_from_api(payload, task_id="review-verdict-test")\n    stored = StoredTask(\n        request=request,\n        api_request=payload,\n        phase=CodeBuilderTaskPhase.AWAITING_APPROVAL,\n        created_at_epoch=1.0,\n        updated_at_epoch=1.0,\n        require_approval=True,\n        auto_start_after_approval=False,\n        cancellation_token=service.create_cancellation_token("review-verdict-test"),\n    )\n\n    review = _review_prepared_change(\n        task_service=service,\n        stored_task=stored,\n        preparation_result={"plan": {"title": "test"}},\n    )\n\n    assert review["verdict"] == "pass"\n    assert not (tmp_path / relative).exists()\n'''
          if "test_ai_review_does_not_treat_negated_block_word_as_block" not in test_text:
              tests.write_text(test_text + addition, encoding="utf-8")
      - name: Targeted verification
        run: |
          pip install -r backend/requirements.txt
          python -m pytest backend/tests/test_code_builder_transaction_boundary.py backend/tests/test_code_builder_execution_pipeline.py -q
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/code_builder/router.py backend/tests/test_code_builder_transaction_boundary.py
          git diff --cached --check
          git commit -m "code-builder: harden AI review verdict parsing"
          git push origin HEAD:work/code-builder-complete
