name: Core Cloud Defaults Remediation

on:
  push:
    branches:
      - work/platform-auth-five-fixes-20260911
    paths:
      - .github/workflows/core-cloud-defaults-remediation.yml

permissions:
  contents: write

jobs:
  remediate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4b01fa7b207bc13b2953718c818ec3856e4d185d"

      - name: Apply targeted cloud-provider fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'{path}: expected text not found: {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {found} occurrence(s)')

          # 1) Voice Studio: real Edge TTS is the system fallback; mock remains explicit-only.
          replace(
              'backend/server.py',
              'os.environ.get("VOICE_PROVIDER", "mock")',
              'os.environ.get("VOICE_PROVIDER", "edge-tts")',
          )

          # 2) Document Studio: Groq is cloud primary, Ollama remains explicitly selectable.
          replace(
              'backend/document_studio/generation_orchestrator.py',
              'DEFAULT_PROVIDER = "ollama"',
              'DEFAULT_PROVIDER = "groq"',
              count=1,
          )
          replace(
              'backend/document_studio/groq_provider.py',
              'DEFAULT_GROQ_MODEL = "openai/gpt-oss-120b"',
              'DEFAULT_GROQ_MODEL = "llama-3.3-70b-versatile"',
              count=1,
          )

          # 3) Executive Advisor: add Groq cloud inference and make it the UI default.
          advisor = Path('backend/ai_runtime/advisor.py')
          text = advisor.read_text(encoding='utf-8')

          old = '''    def openai_configured(self) -> bool:\n        return bool(os.environ.get("OPENAI_API_KEY", "").strip())\n'''
          new = '''    def openai_configured(self) -> bool:\n        return bool(os.environ.get("OPENAI_API_KEY", "").strip())\n\n    def groq_model_name(self) -> str:\n        return os.environ.get("LUMINA_GROQ_MODEL", "llama-3.3-70b-versatile").strip() or "llama-3.3-70b-versatile"\n\n    def groq_configured(self) -> bool:\n        return bool(os.environ.get("GROQ_API_KEY", "").strip())\n'''
          if old not in text:
              raise SystemExit('advisor.py: openai_configured anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''    async def ask(self, owner: str, request: AdvisorRequest) -> dict[str, Any]:\n'''
          groq_method = '''    async def _ask_groq(\n        self,\n        *,\n        messages: list[dict[str, str]],\n    ) -> tuple[str, list[dict[str, str]], str]:\n        api_key = os.environ.get("GROQ_API_KEY", "").strip()\n        if not api_key:\n            raise RuntimeError("GROQ_API_KEY is not configured")\n        model = self.groq_model_name()\n        payload = {\n            "model": model,\n            "messages": messages,\n            "temperature": 0.2,\n        }\n        timeout = httpx.Timeout(connect=10.0, read=120.0, write=30.0, pool=10.0)\n        async with httpx.AsyncClient(timeout=timeout, trust_env=False) as client:\n            response = await client.post(\n                "https://api.groq.com/openai/v1/chat/completions",\n                headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},\n                json=payload,\n            )\n        if response.status_code < 200 or response.status_code >= 300:\n            raise RuntimeError(f"Groq API returned HTTP {response.status_code}: {response.text[:500]}")\n        data = response.json()\n        try:\n            answer = str(data["choices"][0]["message"]["content"]).strip()\n        except (KeyError, IndexError, TypeError) as exc:\n            raise RuntimeError("Groq API returned no output text") from exc\n        if not answer:\n            raise RuntimeError("Groq API returned no output text")\n        return answer, [], model\n\n'''
          if anchor not in text:
              raise SystemExit('advisor.py: ask anchor missing')
          text = text.replace(anchor, groq_method + anchor, 1)

          old = '''        requested_provider = request.provider.strip().casefold()\n        if requested_provider not in {"auto", "local", "openai"}:\n            requested_provider = "auto"\n        use_openai = requested_provider == "openai" or request.web_research\n        if requested_provider == "auto" and not request.web_research:\n            use_openai = False\n\n        started = time.monotonic()\n        sources: list[dict[str, str]] = []\n        error = None\n        if use_openai:\n'''
          new = '''        requested_provider = request.provider.strip().casefold()\n        if requested_provider not in {"auto", "local", "groq", "openai"}:\n            requested_provider = "auto"\n        use_openai = requested_provider == "openai" or request.web_research\n        use_groq = requested_provider == "groq" or (\n            requested_provider == "auto" and not request.web_research and self.groq_configured()\n        )\n\n        started = time.monotonic()\n        sources: list[dict[str, str]] = []\n        error = None\n        if use_groq:\n            try:\n                answer, sources, model = await self._ask_groq(messages=messages)\n                provider = "groq"\n                provider_status = "ok"\n            except Exception as exc:\n                answer = "Groq cloud mode is currently unavailable. Check GROQ_API_KEY, rate limits, network access, and the configured model, then retry or switch provider."\n                model = self.groq_model_name()\n                provider = "groq"\n                provider_status = "unavailable"\n                error = str(exc)\n        elif use_openai:\n'''
          if old not in text:
              raise SystemExit('advisor.py: provider selection anchor missing')
          text = text.replace(old, new, 1)

          old = '''            "available": health.available or self.openai_configured(),\n            "local_available": health.available,\n            "openai_configured": self.openai_configured(),\n            "model": model,\n            "openai_model": self.openai_model_name(),\n'''
          new = '''            "available": health.available or self.groq_configured() or self.openai_configured(),\n            "local_available": health.available,\n            "groq_configured": self.groq_configured(),\n            "openai_configured": self.openai_configured(),\n            "model": model,\n            "groq_model": self.groq_model_name(),\n            "openai_model": self.openai_model_name(),\n'''
          if old not in text:
              raise SystemExit('advisor.py: status anchor missing')
          text = text.replace(old, new, 1)
          advisor.write_text(text, encoding='utf-8')

          frontend = Path('frontend/src/pages/ExecutiveAdvisor.jsx')
          text = frontend.read_text(encoding='utf-8')
          text = text.replace("const [provider, setProvider] = useState('local');", "const [provider, setProvider] = useState('groq');", 1)
          text = text.replace(
              "if ((provider === 'openai' || webResearch) && !status?.openai_configured) {\n      setError('Cloud/Web Research requires OPENAI_API_KEY in the backend environment.');\n      return;\n    }",
              "if (provider === 'groq' && !status?.groq_configured) {\n      setError('Groq requires GROQ_API_KEY in the backend environment.');\n      return;\n    }\n    if ((provider === 'openai' || webResearch) && !status?.openai_configured) {\n      setError('Cloud/Web Research requires OPENAI_API_KEY in the backend environment.');\n      return;\n    }",
              1,
          )
          text = text.replace(
              "${status?.openai_configured ? 'bg-emerald-400' : 'bg-white/20'}`}>Cloud",
              "${status?.groq_configured || status?.openai_configured ? 'bg-emerald-400' : 'bg-white/20'}`}>Cloud",
              1,
          )
          local_button = "<button onClick={() => { setProvider('local'); setWebResearch(false); }} className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-[11px] ${provider === 'local' && !webResearch ? 'border-emerald-400/30 bg-emerald-400/5 text-emerald-200' : 'border-white/10 text-white/35'}`}><HardDrive className=\"h-3.5 w-3.5\" />Local</button>"
          if local_button not in text:
              raise SystemExit('ExecutiveAdvisor.jsx: Local provider button anchor missing')
          groq_button = "<button onClick={() => { setProvider('groq'); setWebResearch(false); }} className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-[11px] ${provider === 'groq' && !webResearch ? 'border-sky-400/30 bg-sky-400/5 text-sky-200' : 'border-white/10 text-white/35'}`}><Cloud className=\"h-3.5 w-3.5\" />Groq</button>"
          text = text.replace(local_button, groq_button + "\n                " + local_button, 1)
          frontend.write_text(text, encoding='utf-8')

          # 4) Image Studio: Replicate-backed FLUX is no longer misreported as public/no-key.
          replace(
              'backend/providers/manager.py',
              'DEFAULT_ORDER = "flux,comfyui,fal,bfl,replicate,openai,gemini,local"',
              'DEFAULT_ORDER = "cloudflare,flux,comfyui,fal,bfl,replicate,openai,gemini,local"',
              count=1,
          )
          replace(
              'backend/providers/manager.py',
              'PUBLIC_NO_CREDENTIAL_PROVIDERS = {"flux"}',
              'PUBLIC_NO_CREDENTIAL_PROVIDERS: set[str] = set()',
              count=1,
          )

          registry = Path('backend/providers/__init__.py')
          text = registry.read_text(encoding='utf-8')
          text = text.replace('from .comfyui_provider import ComfyUIProvider\n', 'from .comfyui_provider import ComfyUIProvider\nfrom .cloudflare_provider import CloudflareFluxProvider\n', 1)
          text = text.replace('_REGISTRY: Dict[str, Type[ImageProvider]] = {\n    "flux": FluxHFProvider,', '_REGISTRY: Dict[str, Type[ImageProvider]] = {\n    "cloudflare": CloudflareFluxProvider,\n    "flux": FluxHFProvider,', 1)
          registry.write_text(text, encoding='utf-8')

          cloudflare_provider = '''"""Cloudflare Workers AI FLUX.1 Schnell image provider."""\nfrom __future__ import annotations\n\nimport asyncio\nimport base64\nimport os\n\nimport httpx\n\nfrom .base import (\n    ErrorKind,\n    GeneratedImage,\n    GenerationInput,\n    ImageProvider,\n    ProviderCapabilities,\n    ProviderError,\n    ProviderInvalidResponseError,\n)\n\nMODEL = "@cf/black-forest-labs/flux-1-schnell"\n\n\nclass CloudflareFluxProvider(ImageProvider):\n    name = "cloudflare"\n    priority = 4\n    capabilities = ProviderCapabilities(\n        generation=True,\n        editing=False,\n        identity_references=False,\n        masks=False,\n        multiple_outputs=True,\n        aspect_ratios=("1:1",),\n        models=(MODEL,),\n        maximum_reference_images=0,\n        maximum_outputs=4,\n    )\n\n    @classmethod\n    def is_configured(cls) -> bool:\n        return bool(\n            os.getenv("CLOUDFLARE_API_TOKEN", "").strip()\n            and os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip()\n        )\n\n    async def _one(self, spec: GenerationInput, seed: int | None) -> GeneratedImage:\n        token = os.getenv("CLOUDFLARE_API_TOKEN", "").strip()\n        account_id = os.getenv("CLOUDFLARE_ACCOUNT_ID", "").strip()\n        if not token or not account_id:\n            raise ProviderError(\n                self.name,\n                "Cloudflare Workers AI credentials are not configured.",\n                kind=ErrorKind.AUTH,\n                retryable=False,\n                safe_message="Cloudflare Workers AI is not configured.",\n            )\n        if spec.reference_images:\n            raise ProviderError(\n                self.name,\n                "FLUX.1 Schnell does not support identity reference images.",\n                kind=ErrorKind.UNSUPPORTED,\n                retryable=False,\n                safe_message="Cloudflare FLUX.1 Schnell supports text-to-image generation only.",\n            )\n        payload = {"prompt": spec.prompt.strip(), "steps": 4}\n        if seed is not None:\n            payload["seed"] = int(seed)\n        url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/{MODEL}"\n        timeout = httpx.Timeout(connect=10.0, read=120.0, write=30.0, pool=10.0)\n        try:\n            async with httpx.AsyncClient(timeout=timeout, trust_env=False) as client:\n                response = await client.post(\n                    url,\n                    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},\n                    json=payload,\n                )\n        except httpx.TimeoutException as exc:\n            raise ProviderError(self.name, str(exc), kind=ErrorKind.TIMEOUT, retryable=True, safe_message="Cloudflare image generation timed out.") from exc\n        except httpx.HTTPError as exc:\n            raise ProviderError(self.name, str(exc), kind=ErrorKind.UNAVAILABLE, retryable=True, safe_message="Cloudflare Workers AI is temporarily unavailable.") from exc\n        if response.status_code < 200 or response.status_code >= 300:\n            kind = ErrorKind.AUTH if response.status_code in {401, 403} else ErrorKind.RATE_LIMIT if response.status_code == 429 else ErrorKind.UNAVAILABLE\n            raise ProviderError(\n                self.name,\n                f"Cloudflare Workers AI returned HTTP {response.status_code}",\n                kind=kind,\n                retryable=response.status_code in {429, 500, 502, 503, 504},\n                status_code=response.status_code,\n                safe_message="Cloudflare Workers AI rejected or could not complete the image request.",\n            )\n        try:\n            envelope = response.json()\n            result = envelope.get("result", envelope) if isinstance(envelope, dict) else {}\n            encoded = result.get("image") if isinstance(result, dict) else None\n            data = base64.b64decode(encoded, validate=True)\n        except Exception as exc:\n            raise ProviderInvalidResponseError(self.name, "Cloudflare returned an invalid image response.") from exc\n        if not data:\n            raise ProviderInvalidResponseError(self.name, "Cloudflare returned an empty image.")\n        return GeneratedImage(data=data, mime_type="image/jpeg")\n\n    async def generate(self, spec: GenerationInput) -> list[GeneratedImage]:\n        if spec.mode not in {"text-to-image", "generate", ""}:\n            raise ProviderError(self.name, "Unsupported Cloudflare FLUX mode.", kind=ErrorKind.UNSUPPORTED, retryable=False)\n        if not spec.prompt.strip():\n            raise ProviderError(self.name, "Prompt is required.", kind=ErrorKind.INVALID_REQUEST, retryable=False)\n        count = max(1, min(int(spec.count or 1), self.capabilities.maximum_outputs))\n        tasks = []\n        for index in range(count):\n            seed = None if spec.seed is None else int(spec.seed) + index\n            tasks.append(self._one(spec, seed))\n        return await asyncio.gather(*tasks)\n'''
          Path('backend/providers/cloudflare_provider.py').write_text(cloudflare_provider, encoding='utf-8')

          env_file = Path('backend/.env.example')
          env_text = env_file.read_text(encoding='utf-8')
          if 'CLOUDFLARE_API_TOKEN=' not in env_text:
              env_text += '\n# Cloudflare Workers AI (Image Studio FLUX)\nCLOUDFLARE_API_TOKEN=\nCLOUDFLARE_ACCOUNT_ID=\n'
          env_file.write_text(env_text, encoding='utf-8')
          PY

      - name: Compile changed backend files
        run: |
          python -m py_compile \
            backend/server.py \
            backend/ai_runtime/advisor.py \
            backend/document_studio/generation_orchestrator.py \
            backend/document_studio/groq_provider.py \
            backend/providers/manager.py \
            backend/providers/cloudflare_provider.py \
            backend/providers/__init__.py

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run targeted backend tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find backend/tests -maxdepth 1 -type f \( \
            -name 'test_voice*.py' -o \
            -name 'test_document_studio*.py' -o \
            -name 'test_generation_orchestration.py' -o \
            -name 'test_*advisor*.py' -o \
            -name 'test_*provider*.py' -o \
            -name 'test_identity_packs.py' \
          \) | sort -u)
          printf 'Targeted tests (%s):\n' "${#TESTS[@]}"
          printf ' - %s\n' "${TESTS[@]}"
          PYTHONPATH=backend python -m pytest -q "${TESTS[@]}"

      - name: Frontend advisor build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit remediation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/core-cloud-defaults-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py \
            backend/document_studio/generation_orchestrator.py \
            backend/document_studio/groq_provider.py \
            backend/ai_runtime/advisor.py \
            frontend/src/pages/ExecutiveAdvisor.jsx \
            backend/providers/manager.py \
            backend/providers/__init__.py \
            backend/providers/cloudflare_provider.py \
            backend/.env.example \
            .github/workflows/core-cloud-defaults-remediation.yml
          git commit -m "fix(cloud): use real cloud providers by default"
          git push origin HEAD:work/platform-auth-five-fixes-20260911
