name: Voice Studio Targeted Audit
on:
  push:
    branches:
      - audit/voice-tests-20260911
permissions:
  contents: read
jobs:
  voice-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8aee69d294f56c6106b850deaeb1f8bc2481930b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run targeted Voice Studio tests only
        run: python -m pytest -q backend/tests/test_voice_provider_unit.py backend/tests/test_voice_studio_professional_unit.py
