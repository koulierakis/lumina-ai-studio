name: Unified integration apply

on:
  push:
    branches:
      - integration/lumina-final-unified
    paths:
      - tools/apply_unified_backend_integrations.py
      - .github/workflows/unified-integration-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/lumina-final-unified
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic integration wiring
        run: python tools/apply_unified_backend_integrations.py
      - name: Commit generated integration changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/persistence.py frontend/src/pages/VoiceStudio.jsx
          git commit -m "integrate(unified): wire Personal Voice and Mentor backend"
          git push origin HEAD:integration/lumina-final-unified
