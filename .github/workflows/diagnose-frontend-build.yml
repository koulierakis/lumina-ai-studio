name: Diagnose Frontend Build

on:
  push:
    branches: [work/lumina-master-completion]
    paths:
      - '.github/workflows/diagnose-frontend-build.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show actual Document Studio source
        run: |
          git rev-parse HEAD
          find frontend/src/pages -maxdepth 1 -iname 'DocumentStudio*' -print
          sed -n '1,15p' frontend/src/pages/DocumentStudio.jsx
      - name: Install frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Show source after install
        run: |
          find frontend/src/pages -maxdepth 1 -iname 'DocumentStudio*' -print
          sed -n '1,15p' frontend/src/pages/DocumentStudio.jsx
      - name: Build
        working-directory: frontend
        run: npm run build
