name: Patch OpenVoice V2 personal voice pipeline

on:
  push:
    branches:
      - work/platform-auth-five-fixes-20260911
    paths:
      - scripts/patch_openvoice_v2_pipeline.py
      - .github/workflows/patch-openvoice-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/platform-auth-five-fixes-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply OpenVoice V2 pipeline patch
        run: python scripts/patch_openvoice_v2_pipeline.py
      - name: Validate Python syntax
        run: python -m py_compile backend/server.py backend/voice_providers/openvoice_v2.py
      - name: Run Voice Studio tests
        working-directory: backend
        run: pytest -q tests/test_voice_provider_unit.py tests/test_voice_studio_professional_unit.py tests/test_openvoice_v2_adapter_unit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit verified pipeline and remove temporary patch automation
        shell: bash
        run: |
          rm -f scripts/patch_openvoice_v2_pipeline.py .github/workflows/patch-openvoice-v2.yml
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(voice): apply OpenVoice V2 tone conversion"
          git push origin HEAD:work/platform-auth-five-fixes-20260911
