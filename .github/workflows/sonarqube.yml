name: SonarQube Cloud

on:
  push:
    branches:
      - work/lumina-production-unified
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Generate backend coverage
        run: python -m pytest backend/tests launcher/tests --override-ini addopts= --cov=backend --cov=launcher --cov-report=xml:coverage.xml -q
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate frontend coverage
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand --coverage --coverageReporters=lcov
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
