name: LUMINA Master OpenHands Validation

on:
  push:
    branches:
      - work/lumina-master-completion
    paths:
      - 'backend/code_builder/openhands_*.py'
      - 'backend/code_builder/models.py'
      - 'backend/code_builder/task_service.py'
      - 'backend/code_builder/task_service_engine_hooks.py'
      - 'backend/code_builder/engine_preparation_service.py'
      - 'backend/code_builder/router_engine_bridge.py'
      - 'backend/tests/test_openhands_*.py'
      - 'backend/tests/test_task_service_engine_hooks.py'
      - 'backend/tests/test_engine_preparation_service.py'
      - 'backend/tests/test_task_engine_integration.py'
      - 'backend/tests/test_router_engine_bridge.py'
      - 'backend/tests/conftest.py'
      - '.github/workflows/lumina-master-openhands-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openhands-safety:
    name: OpenHands sandbox safety and orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LUMINA_SKIP_TEST_SERVER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'pytest>=8.0.0' 'pytest-xdist>=3.6.0'
          'pydantic>=2.6.4' 'fastapi==0.110.1'
          'httpx>=0.27.0,<1.0.0'
      - name: Compile OpenHands integration
        run: |
          python -m py_compile backend/code_builder/openhands_adapter.py
          python -m py_compile backend/code_builder/openhands_workspace_service.py
          python -m py_compile backend/code_builder/openhands_change_capture_service.py
          python -m py_compile backend/code_builder/openhands_execution_service.py
          python -m py_compile backend/code_builder/openhands_engine.py
          python -m py_compile backend/code_builder/openhands_engine_service.py
          python -m py_compile backend/code_builder/openhands_proposal_service.py
          python -m py_compile backend/code_builder/openhands_patch_bridge.py
          python -m py_compile backend/code_builder/openhands_preparation_service.py
          python -m py_compile backend/code_builder/task_service_engine_hooks.py
          python -m py_compile backend/code_builder/engine_preparation_service.py
          python -m py_compile backend/code_builder/router_engine_bridge.py
          python -m py_compile backend/code_builder/models.py
          python -m py_compile backend/code_builder/task_service.py
      - name: Run full OpenHands integration tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_openhands_*.py
          tests/test_task_service_engine_hooks.py
          tests/test_engine_preparation_service.py
          tests/test_task_engine_integration.py
          tests/test_router_engine_bridge.py
