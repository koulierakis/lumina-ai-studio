name: finalize-lumina-release

on:
  push:
    branches:
      - release/lumina-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OWNER_EMAIL: owner@lumina.local
      OWNER_PASSWORD: CI-only-password-2026!
      JWT_SECRET: ci-release-jwt-secret-change-in-local-env-2026
      LUMINA_TEST_OWNER_PASSWORD: CI-only-password-2026!
      IMAGE_PROVIDER: mock
      VIDEO_PROVIDER: mock
      VOICE_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lumina-complete
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply deterministic release patches
        run: python scripts/finalize_release.py

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt ruff pytest

      - name: Backend lint
        run: ruff check backend launcher

      - name: Backend tests
        run: python -m pytest backend/tests launcher/tests -q

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
        env:
          CI: 'false'

      - name: Commit validated release patch
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "Lumina Release Bot"
            git config user.email "actions@users.noreply.github.com"
            git add backend/server.py frontend/src/App.js frontend/src/platform/moduleRegistry.js frontend/src/pages/ProductivityCenter.jsx IMPLEMENTATION_STATUS.md
            git commit -m "Finalize Lumina core modules [skip ci]"
            git push origin HEAD:release/lumina-complete
          fi

      - name: Build clean downloadable bundle
        shell: bash
        run: |
          rm -rf dist/LUMINA-AI-STUDIO
          mkdir -p dist/LUMINA-AI-STUDIO
          git archive HEAD | tar -x -C dist/LUMINA-AI-STUDIO
          rm -rf dist/LUMINA-AI-STUDIO/frontend/build
          cp -R frontend/build dist/LUMINA-AI-STUDIO/frontend/build
          cat > dist/LUMINA-AI-STUDIO/RELEASE_VALIDATED.txt <<'EOF'
          LUMINA AI STUDIO — VALIDATED RELEASE BUNDLE
          Branch: release/lumina-complete
          This bundle passed backend Ruff, backend/launcher pytest, frontend Jest and frontend production build in GitHub Actions.
          External paid AI providers remain credential-dependent; local/core functionality and mock/local providers require no paid key.
          EOF
          cd dist
          zip -qr LUMINA-AI-STUDIO-COMPLETE.zip LUMINA-AI-STUDIO

      - name: Upload completed Lumina bundle
        uses: actions/upload-artifact@v4
        with:
          name: LUMINA-AI-STUDIO-COMPLETE
          path: dist/LUMINA-AI-STUDIO-COMPLETE.zip
          retention-days: 30
