name: voice-runtime-selftest

on:
  push:
    branches:
      - work/lumina-voice-lab-v1
    paths:
      - .github/workflows/voice-runtime-selftest.yml

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install client
        run: pip install 'gradio_client>=1.8,<2'
      - name: Generate Greek cloned voice
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          from gradio_client import Client, handle_file

          ref = Path('/tmp/el_m.flac')
          urllib.request.urlretrieve('https://storage.googleapis.com/chatterbox-demo-samples/mtl_prompts/el_m.flac', ref)
          client = Client('ResembleAI/Chatterbox-Multilingual-TTS')
          result = client.predict(
              'Καλημέρα. Αυτή είναι μια δοκιμή της προσωπικής φωνής στο Lumina AI Studio.',
              'el',
              handle_file(str(ref)),
              0.5,
              0.8,
              0,
              0.5,
              api_name='/generate_tts_audio',
          )
          path = result[0] if isinstance(result, (list, tuple)) else result
          if isinstance(path, dict):
              path = path.get('path') or path.get('name')
          data = Path(str(path)).read_bytes()
          assert len(data) > 1000, len(data)
          assert data[:4] == b'RIFF', data[:16]
          print(f'VOICE_RUNTIME_OK bytes={len(data)}')
          PY
