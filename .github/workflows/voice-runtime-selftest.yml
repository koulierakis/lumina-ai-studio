name: Voice Runtime Self-Test

on:
  push:
    branches:
      - work/lumina-voice-lab-v1
    paths:
      - '.github/workflows/voice-runtime-selftest.yml'

jobs:
  openvoice-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Greek TTS client
        run: pip install edge-tts
      - name: Create a short Greek speech reference
        run: edge-tts --voice el-GR-NestorasNeural --text 'Καλημέρα. Αυτή είναι μία σύντομη δοκιμή φωνής.' --write-media /tmp/reference.mp3
      - name: Verify OpenVoice conversion worker
        run: |
          code=$(curl -sS -o /tmp/converted.wav -w '%{http_code}' --max-time 600 \
            -F 'source_audio=@/tmp/reference.mp3;type=audio/mpeg' \
            -F 'reference_audio=@/tmp/reference.mp3;type=audio/mpeg' \
            -F 'output_format=wav' \
            -F 'engine=openvoice-v2' \
            https://lumina-openvoice-v2.onrender.com/convert)
          echo "worker_http=$code"
          test "$code" = "200"
          test -s /tmp/converted.wav
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/converted.wav')
          assert p.stat().st_size > 1000, p.stat().st_size
          assert p.read_bytes()[:4] == b'RIFF'
          print(f'OpenVoice self-test PASS: {p.stat().st_size} bytes')
          PY
