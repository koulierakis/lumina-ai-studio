name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt ruff
      - name: Apply safe Documents Python quality fixes in validation workspace
        run: ruff check --fix --exit-zero backend/document_studio backend/tests/test_document_studio_unit.py
      - name: Lint Documents backend
        run: ruff check --output-format=github backend/document_studio backend/tests/test_document_studio_unit.py
      - name: Test Documents backend
        run: python -m pytest backend/tests/test_document_studio_unit.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test Documents AI Assistant
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/DocumentAIAssistantPanel.test.jsx
      - name: Test Rich Editor editability lifecycle
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/DocumentRichEditor.test.jsx -t "becomes editable"
      - name: Test Rich Editor sanitization
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/DocumentRichEditor.test.jsx -t "sanitizes dangerous"
      - name: Test Rich Editor plain text paste
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/DocumentRichEditor.test.jsx -t "plain text paste"
      - name: Test Rich Editor legacy page break
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/DocumentRichEditor.test.jsx -t "legacy page break"
      - name: Test Rich Editor page flow model
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/DocumentRichEditor.test.jsx -t "default A4|Letter and landscape|custom margins|page count increases|manual page break|zoom does not|20-page"
      - name: Test Documents Pagination
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/PaginatedDocumentWorkspace.test.jsx
      - name: Test Documents Workspace Contract
        run: CI=true npm test -- --watchAll=false --runInBand --runTestsByPath src/components/documentstudio/DocumentWorkspaceLayout.test.js
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current release tree for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-git --redact --exit-code=1
      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto
