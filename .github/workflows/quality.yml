name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  document-cv-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Run Greek CV end-to-end acceptance gate
        run: python -m pytest backend/tests/test_document_studio_cv_e2e.py -q
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt ruff
      - name: Apply safe Python quality fixes in the validation workspace
        run: ruff check --fix --exit-zero backend launcher
      - run: ruff check --output-format=github backend launcher
      - run: python -m pytest backend/tests launcher/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Document Studio CV acceptance tests
        run: CI=true npm test -- --watchAll=false src/components/documentstudio/DocumentAIAssistantPanel.test.jsx
      - run: npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan current release tree for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-git --redact --exit-code=1
      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto
