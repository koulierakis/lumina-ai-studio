name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  code-builder-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Verify backend imports before acceptance tests
        run: python -c "import sys; sys.path.insert(0, 'backend'); import server"
      - name: Run Code Builder prompt-to-verified-change acceptance gate
        run: python -m pytest backend/tests/test_code_builder_ai_patch_generation.py backend/tests/test_code_builder_prompt_e2e.py backend/tests/test_code_builder_execution_pipeline.py backend/tests/test_code_builder_kilo_adapter.py backend/tests/test_openhands_adapter.py backend/tests/test_openhands_engine.py backend/tests/test_openhands_patch_bridge.py backend/tests/test_openhands_preparation_service.py backend/tests/test_engine_preparation_service.py backend/tests/test_task_engine_integration.py -q
  document-cv-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Run Greek CV end-to-end acceptance gate
        run: python -m pytest backend/tests/test_document_studio_cv_e2e.py -q
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt ruff
      - run: python -m pytest backend/tests launcher/tests -q
      - name: Fresh local startup and authenticated API smoke
        run: python scripts/lumina-smoke.py
      - name: Apply safe Python quality fixes in the validation workspace
        run: ruff check --fix --exit-zero backend launcher
      - run: ruff check --output-format=github backend launcher
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Diagnose installed React Router entry points
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          for (const name of ['react-router-dom', 'react-router']) {
            const pkgPath = require.resolve(`${name}/package.json`);
            const pkg = require(pkgPath);
            const dir = path.dirname(pkgPath);
            console.log(JSON.stringify({name, version: pkg.version, main: pkg.main, module: pkg.module, exports: pkg.exports}, null, 2));
            for (const subdir of ['dist', 'dist/development']) {
              const target = path.join(dir, subdir);
              if (fs.existsSync(target)) console.log(subdir, fs.readdirSync(target).slice(0, 80));
            }
            try { console.log('resolved', require.resolve(name)); } catch (error) { console.log('resolve-error', error.message); }
          }
          NODE
      - name: Run full frontend test suite
        run: CI=true npm test -- --watchAll=false --runInBand
      - run: npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan current release tree for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-git --redact --exit-code=1
      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto
