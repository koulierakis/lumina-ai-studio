name: runner-diagnostic

on:
  push:
    branches:
      - work/code-builder-refresh
  pull_request:
    branches:
      - release/lumina-complete

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Runner started
        run: |
          echo "RUNNER_DIAGNOSTIC_STARTED"
          python --version
          node --version || true
