name: LUMINA Playwright Test

on:
  workflow_dispatch:

jobs:
  test-lumina:
    name: Test live LUMINA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Test LUMINA production
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            const errors = [];
            page.on('pageerror', error => errors.push(error.message));

            console.log('Opening LUMINA...');
            const response = await page.goto(
              'https://lumina-ai-studio.onrender.com',
              { waitUntil: 'domcontentloaded', timeout: 120000 }
            );

            if (!response || !response.ok()) {
              throw new Error(
                `LUMINA failed to load. HTTP status: ${response?.status()}`
              );
            }

            console.log('HTTP:', response.status());
            console.log('Title:', await page.title());
            console.log('URL:', page.url());

            await page.screenshot({
              path: 'lumina-production.png',
              fullPage: true
            });

            if (errors.length) {
              console.log('Browser JavaScript errors:');
              errors.forEach(error => console.log('-', error));
            }

            console.log('LUMINA production browser test completed.');
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Upload test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-playwright-result
          path: lumina-production.png
          if-no-files-found: ignore
