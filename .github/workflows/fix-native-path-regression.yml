name: Fix Native Path Regression

on:
  push:
    branches:
      - work/lumina-master-completion
    paths:
      - .github/workflows/fix-native-path-regression.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lumina-master-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Repair path handling without widening approved scope
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("backend/code_builder/patch_generation_service.py")
          text = path.read_text(encoding="utf-8")

          shortcut = re.compile(
              r'    if text\.startswith\("/"\):\n'
              r'        # POSIX-style root-relative reference; Windows paths with a drive\n'
              r'        # are handled by the absolute-path branch below\.\n'
              r'        return _normalize_relative_path\(text\.lstrip\("/"\)\)\n'
          )
          text, count = shortcut.subn("", text, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one unsafe POSIX shortcut; found {count}. Refusing blind edit.")

          old = '''        operation = str(raw.get("operation") or "").strip()\n        operation = _OPERATION_ALIASES.get(operation, operation)\n        path = _coerce_repository_relative_path(raw.get("path"), root)\n        if operation not in ALLOWED_OPERATIONS or path is None:\n'''
          new = '''        operation = str(raw.get("operation") or "").strip()\n        operation = _OPERATION_ALIASES.get(operation, operation)\n        raw_path = raw.get("path")\n        path = _coerce_repository_relative_path(raw_path, root)\n        if path is None and isinstance(raw_path, str) and raw_path.startswith("/"):\n            approved_root_relative = _normalize_relative_path(raw_path.lstrip("/"))\n            if approved_root_relative in allowed_paths:\n                path = approved_root_relative\n        if operation not in ALLOWED_OPERATIONS or path is None:\n'''
          if old not in text:
              raise SystemExit("Expected patch-operation path block was not found; refusing blind edit.")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile repaired file
        run: python -m py_compile backend/code_builder/patch_generation_service.py
      - name: Run focused Native Code Builder regression tests
        run: python -m pytest backend/tests/test_code_builder_ai_patch_generation.py -q
      - name: Commit verified repair
        run: |
          git config user.name "LUMINA CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/code_builder/patch_generation_service.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix native Code Builder path handling"
          git push origin HEAD:work/lumina-master-completion
