name: Fix Native Path Regression

on:
  push:
    branches:
      - work/lumina-master-completion
    paths:
      - .github/workflows/fix-native-path-regression.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lumina-master-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Repair absolute-path coercion without widening repository scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/code_builder/patch_generation_service.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if text.startswith("/"):
              # POSIX-style root-relative reference; Windows paths with a drive
              # are handled by the absolute-path branch below.
              return _normalize_relative_path(text.lstrip("/"))
          candidate = Path(text)
          if not candidate.is_absolute():
              return None
          try:
              resolved = candidate.resolve(strict=False)
              relative = resolved.relative_to(root.resolve()).as_posix()
          except (OSError, ValueError):
              return None
          return _normalize_relative_path(relative)
          '''
          new = '''    candidate = Path(text)
          if not candidate.is_absolute():
              return None
          try:
              resolved = candidate.resolve(strict=False)
              relative = resolved.relative_to(root.resolve()).as_posix()
          except (OSError, ValueError):
              return None
          return _normalize_relative_path(relative)
          '''
          if old not in text:
              raise SystemExit("Expected path-coercion block was not found; refusing an unsafe blind edit.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Run focused Native Code Builder regression tests
        run: python -m pytest backend/tests/test_code_builder_ai_patch_generation.py -q
      - name: Commit verified repair
        run: |
          git config user.name "LUMINA CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/code_builder/patch_generation_service.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix native Code Builder absolute path coercion"
          git push origin HEAD:work/lumina-master-completion
