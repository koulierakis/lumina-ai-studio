name: code-builder-transaction-boundary
on:
  push:
    branches:
      - work/code-builder-transactional
    paths:
      - .github/workflows/code-builder-transaction-boundary.yml
permissions:
  contents: write
jobs:
  apply-transaction-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/code-builder-transactional
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic Code Builder transaction-boundary patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/code_builder/router.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '''class TaskDetailResponse(TaskSummaryResponse):\n    request: dict[str, Any]\n    result: dict[str, Any] | None = None\n    events: tuple[TaskEventResponse, ...] = Field(default_factory=tuple)\n''',
              '''class TaskDetailResponse(TaskSummaryResponse):\n    request: dict[str, Any]\n    result: dict[str, Any] | None = None\n    preparation_result: dict[str, Any] | None = None\n    events: tuple[TaskEventResponse, ...] = Field(default_factory=tuple)\n''',
          )

          replace_once(
              '''    cancellation_token: TaskCancellationToken\n    result: Any = None\n    started_at_epoch: float | None = None\n''',
              '''    cancellation_token: TaskCancellationToken\n    result: Any = None\n    preparation_result: Any = None\n    started_at_epoch: float | None = None\n''',
          )

          anchor = '''def _phase_from_result(\n    result: Any,\n) -> CodeBuilderTaskPhase:\n'''
          helpers = '''def _build_preparation_request(stored_task: StoredTask) -> TaskRequest:\n    metadata = dict(stored_task.request.metadata)\n    metadata["code_builder_preparation"] = True\n    return stored_task.request.model_copy(\n        update={\n            "dry_run": True,\n            "backup_policy": BackupPolicy.DISABLED,\n            "build_policy": BuildPolicy.DISABLED,\n            "rollback_policy": RollbackPolicy.NEVER,\n            "metadata": metadata,\n        }\n    )\n\n\ndef _bind_prepared_patch_to_request(stored_task: StoredTask) -> TaskRequest:\n    prepared = _serialize_value(stored_task.preparation_result)\n    if not isinstance(prepared, Mapping):\n        raise CodeBuilderApprovalError(\n            "Task does not have a completed preparation result."\n        )\n\n    raw_patch = prepared.get("patch")\n    if not isinstance(raw_patch, Mapping):\n        raise CodeBuilderApprovalError(\n            "Task preparation did not produce an approvable patch."\n        )\n\n    raw_operations = raw_patch.get("operations")\n    if not isinstance(raw_operations, Sequence) or isinstance(\n        raw_operations, (str, bytes, bytearray)\n    ) or not raw_operations:\n        raise CodeBuilderApprovalError(\n            "Task preparation did not produce patch operations."\n        )\n\n    metadata = dict(stored_task.request.metadata)\n    metadata.pop("patch_operations", None)\n    metadata.pop("execution_patch_operations", None)\n    metadata["approved_patch_operations"] = list(raw_operations)\n    metadata["approved_preparation_task_id"] = stored_task.request.task_id\n    return stored_task.request.model_copy(update={"metadata": metadata})\n\n\n'''
          replace_once(anchor, helpers + anchor)

          replace_once(
              '''    serialized_result = _serialize_value(\n        stored_task.result\n    )\n\n    serialized_rollback = _serialize_value(\n''',
              '''    serialized_result = _serialize_value(\n        stored_task.result\n    )\n    serialized_preparation = _serialize_value(\n        stored_task.preparation_result\n    )\n\n    serialized_rollback = _serialize_value(\n''',
          )

          replace_once(
              '''        result=(\n            dict(serialized_result)\n            if isinstance(\n                serialized_result,\n                Mapping,\n            )\n            else (\n                {\n                    "value": serialized_result,\n                }\n                if serialized_result is not None\n                else None\n            )\n        ),\n        events=events,\n''',
              '''        result=(\n            dict(serialized_result)\n            if isinstance(\n                serialized_result,\n                Mapping,\n            )\n            else (\n                {\n                    "value": serialized_result,\n                }\n                if serialized_result is not None\n                else None\n            )\n        ),\n        preparation_result=(\n            dict(serialized_preparation)\n            if isinstance(serialized_preparation, Mapping)\n            else None\n        ),\n        events=events,\n''',
          )

          replace_once(
              '''    if new_phase is not None:\n        stored_task.phase = new_phase\n''',
              '''    if (\n        stored_task.require_approval\n        and stored_task.approved_at_epoch is None\n        and new_phase in {\n            CodeBuilderTaskPhase.EXECUTING,\n            CodeBuilderTaskPhase.COMPLETED,\n        }\n    ):\n        new_phase = CodeBuilderTaskPhase.ANALYZING\n\n    if new_phase is not None:\n        stored_task.phase = new_phase\n''',
          )

          old_runner = '''    with stored_task.execution_lock:\n        if stored_task.phase in {\n            CodeBuilderTaskPhase.EXECUTING,\n            CodeBuilderTaskPhase.COMPLETED,\n            CodeBuilderTaskPhase.ROLLED_BACK,\n        }:\n            return\n\n        if (\n            stored_task.require_approval\n            and stored_task.approved_at_epoch is None\n        ):\n            stored_task.phase = (\n                CodeBuilderTaskPhase.AWAITING_APPROVAL\n            )\n            stored_task.touch()\n            return\n\n        stored_task.phase = (\n            CodeBuilderTaskPhase.EXECUTING\n        )\n        stored_task.started_at_epoch = time.time()\n        stored_task.finished_at_epoch = None\n        stored_task.touch()\n\n    callback = _task_event_callback(\n        task_store,\n        stored_task,\n    )\n\n    try:\n        result = task_service.execute(\n            stored_task.request,\n'''
          new_runner = '''    with stored_task.execution_lock:\n        if stored_task.phase in {\n            CodeBuilderTaskPhase.EXECUTING,\n            CodeBuilderTaskPhase.COMPLETED,\n            CodeBuilderTaskPhase.ROLLED_BACK,\n        }:\n            return\n\n        preparing = (\n            stored_task.require_approval\n            and stored_task.approved_at_epoch is None\n        )\n        stored_task.phase = (\n            CodeBuilderTaskPhase.ANALYZING\n            if preparing\n            else CodeBuilderTaskPhase.EXECUTING\n        )\n        stored_task.started_at_epoch = time.time()\n        stored_task.finished_at_epoch = None\n        stored_task.touch()\n\n    callback = _task_event_callback(\n        task_store,\n        stored_task,\n    )\n    execution_request = (\n        _build_preparation_request(stored_task)\n        if preparing\n        else stored_task.request\n    )\n\n    try:\n        result = task_service.execute(\n            execution_request,\n'''
          replace_once(old_runner, new_runner)

          replace_once(
              '''    with stored_task.execution_lock:\n        stored_task.result = result\n        stored_task.phase = _phase_from_result(\n            result\n        )\n        stored_task.finished_at_epoch = time.time()\n        stored_task.touch()\n''',
              '''    with stored_task.execution_lock:\n        stored_task.result = result\n        if preparing:\n            if _phase_from_result(result) is not CodeBuilderTaskPhase.COMPLETED:\n                stored_task.phase = _phase_from_result(result)\n                stored_task.finished_at_epoch = time.time()\n            else:\n                stored_task.preparation_result = result\n                stored_task.phase = CodeBuilderTaskPhase.AWAITING_APPROVAL\n                stored_task.metadata["preparation_completed_at_epoch"] = time.time()\n                stored_task.finished_at_epoch = None\n        else:\n            stored_task.phase = _phase_from_result(result)\n            stored_task.finished_at_epoch = time.time()\n        stored_task.touch()\n''',
          )

          replace_once(
              '''    initial_phase = (\n        CodeBuilderTaskPhase.AWAITING_APPROVAL\n        if payload.require_approval\n        else CodeBuilderTaskPhase.QUEUED\n    )\n''',
              '''    initial_phase = CodeBuilderTaskPhase.QUEUED\n''',
          )

          replace_once(
              '''    if (\n        not is_existing_idempotent_task\n        and not payload.require_approval\n    ):\n        _schedule_task_execution(\n''',
              '''    if not is_existing_idempotent_task:\n        _schedule_task_execution(\n''',
          )

          replace_once(
              '''        stored_task.approved_at_epoch = (\n            time.time()\n        )\n''',
              '''        try:\n            stored_task.request = _bind_prepared_patch_to_request(\n                stored_task\n            )\n        except CodeBuilderApprovalError as exc:\n            raise HTTPException(\n                status_code=status.HTTP_409_CONFLICT,\n                detail={\n                    "error": "task_not_prepared",\n                    "message": str(exc),\n                    "task_id": normalized_task_id,\n                },\n            ) from exc\n\n        stored_task.approved_at_epoch = (\n            time.time()\n        )\n''',
          )

          path.write_text(text, encoding="utf-8")
      - name: Add focused transaction-boundary tests
        shell: bash
        run: |
          cat > backend/tests/test_code_builder_transaction_boundary.py <<'PY'
          from pathlib import Path

          from code_builder.backup_service import BackupService
          from code_builder.build_service import BuildService, BuildServiceConfiguration
          from code_builder.patch_service import PatchService
          from code_builder.planning_service import GeneratedChangePlan, GeneratedFileChange, GeneratedPlanStep
          from code_builder.router import (
              CodeBuilderTaskPhase,
              StoredTask,
              TaskCreateRequest,
              TaskStore,
              _bind_prepared_patch_to_request,
              _run_stored_task_sync,
              _task_request_from_api,
          )
          from code_builder.task_service import BuildPolicy, TaskService, TaskServiceConfiguration


          class StaticRepositoryService:
              def __init__(self, root: Path) -> None:
                  self.repository_root = root

              def analyze_repository(self):
                  return {"repository_root": str(self.repository_root), "files": []}


          class StaticPlanningService:
              def __init__(self, plan: GeneratedChangePlan) -> None:
                  self.plan_result = plan

              def plan(self, **_):
                  return self.plan_result


          class UnusedOllamaService:
              pass


          def make_plan(path: str) -> GeneratedChangePlan:
              return GeneratedChangePlan(
                  title="Prepared change",
                  summary="Prepare one deterministic file change.",
                  objective="Verify approval is the production-write boundary.",
                  risk_level="low",
                  files=[GeneratedFileChange(path=path, operation="create", summary="Create file", rationale="test")],
                  steps=[GeneratedPlanStep(order=1, title="Create", description="Create file", file_paths=[path], validation=["verify"])],
                  acceptance_criteria=["file exists after approval"],
                  test_plan=["targeted verification"],
                  rollback_plan=["restore backup"],
              )


          def make_service(root: Path, path: str) -> TaskService:
              return TaskService(
                  repository_service=StaticRepositoryService(root),
                  planning_service=StaticPlanningService(make_plan(path)),
                  backup_service=BackupService(root),
                  patch_service=PatchService(repository_root=root),
                  build_service=BuildService(BuildServiceConfiguration(repository_root=root)),
                  ollama_service=UnusedOllamaService(),
                  configuration=TaskServiceConfiguration(
                      repository_root=root,
                      use_default_build_sequence=False,
                      include_ruff=False,
                      include_mypy=False,
                      include_frontend_tests=False,
                      include_frontend_build=False,
                  ),
              )


          def test_preparation_generates_diff_without_writing_then_approval_applies(tmp_path: Path) -> None:
              relative = "backend/prepared_boundary.py"
              (tmp_path / "backend").mkdir()
              payload = TaskCreateRequest(
                  instruction="Create the prepared boundary module.",
                  require_approval=True,
                  auto_start_after_approval=False,
                  build_policy=BuildPolicy.DISABLED,
                  metadata={
                      "patch_operations": [
                          {"operation": "create", "path": relative, "content": "BOUNDARY = 'approved'\n"}
                      ]
                  },
              )
              service = make_service(tmp_path, relative)
              request = _task_request_from_api(payload, task_id="boundary-test")
              stored = StoredTask(
                  request=request,
                  api_request=payload,
                  phase=CodeBuilderTaskPhase.QUEUED,
                  created_at_epoch=1.0,
                  updated_at_epoch=1.0,
                  require_approval=True,
                  auto_start_after_approval=False,
                  cancellation_token=service.create_cancellation_token("boundary-test"),
              )
              store = TaskStore()
              store.create(stored)

              _run_stored_task_sync(task_service=service, task_store=store, stored_task=stored)

              assert stored.phase is CodeBuilderTaskPhase.AWAITING_APPROVAL
              assert stored.preparation_result is not None
              assert not (tmp_path / relative).exists()
              prepared = stored.preparation_result
              assert prepared.patch_validation is not None
              assert "BOUNDARY = 'approved'" in prepared.patch_validation.results[0].diff

              stored.request = _bind_prepared_patch_to_request(stored)
              stored.approved_at_epoch = 2.0
              stored.phase = CodeBuilderTaskPhase.APPROVED
              stored.cancellation_token = service.create_cancellation_token("boundary-test")
              _run_stored_task_sync(task_service=service, task_store=store, stored_task=stored)

              assert stored.phase is CodeBuilderTaskPhase.COMPLETED, stored.result
              assert (tmp_path / relative).read_text(encoding="utf-8") == "BOUNDARY = 'approved'\n"
          PY
      - name: Targeted verification
        run: |
          pip install -r backend/requirements.txt
          python -m pytest backend/tests/test_code_builder_transaction_boundary.py backend/tests/test_code_builder_execution_pipeline.py -q
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/code_builder/router.py backend/tests/test_code_builder_transaction_boundary.py
          git diff --cached --check
          git commit -m "code-builder: enforce approval transaction boundary"
          git push origin HEAD:work/code-builder-transactional
