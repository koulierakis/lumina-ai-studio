name: Code Builder symlink recovery

on:
  push:
    branches:
      - work/code-builder-refresh
    paths:
      - .github/workflows/code-builder-symlink-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/code-builder-refresh
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Apply executable symlink preservation fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/code_builder/build_service.py')
          text = path.read_text(encoding='utf-8')

          old_explicit = '''        resolved = _validate_resolved_executable_file(candidate)\n\n        if _is_relative_to(resolved, repository_root):'''
          new_explicit = '''        resolved = _validate_resolved_executable_file(candidate)\n        execution_path = candidate.absolute()\n\n        if _is_relative_to(resolved, repository_root):'''
          if old_explicit not in text:
              raise SystemExit('explicit-path patch anchor not found')
          text = text.replace(old_explicit, new_explicit, 1)

          old_return_explicit = '''        return resolved\n\n    environment = dict(search_environment or os.environ)'''
          new_return_explicit = '''        return execution_path\n\n    environment = dict(search_environment or os.environ)'''
          if old_return_explicit not in text:
              raise SystemExit('explicit-path return anchor not found')
          text = text.replace(old_return_explicit, new_return_explicit, 1)

          old_path = '''    resolved = _validate_resolved_executable_file(Path(located))\n\n    if ('''
          new_path = '''    resolved = _validate_resolved_executable_file(Path(located))\n    execution_path = Path(located).absolute()\n\n    if ('''
          if old_path not in text:
              raise SystemExit('PATH patch anchor not found')
          text = text.replace(old_path, new_path, 1)

          old_return_path = '''    return resolved\n\n\ndef _invoke_optional_security_hook('''
          new_return_path = '''    return execution_path\n\n\ndef _invoke_optional_security_hook('''
          if old_return_path not in text:
              raise SystemExit('PATH return anchor not found')
          text = text.replace(old_return_path, new_return_path, 1)

          path.write_text(text, encoding='utf-8')

      - name: Add regression test
        shell: python
        run: |
          from pathlib import Path
          test_path = Path('backend/tests/test_code_builder_executable_symlink.py')
          test_path.write_text('''from __future__ import annotations\n\nimport os\nfrom pathlib import Path\nimport sys\n\nimport pytest\n\nfrom code_builder.build_service import resolve_executable\n\n\n@pytest.mark.skipif(os.name == "nt", reason="POSIX symlink regression")\ndef test_resolve_executable_preserves_path_symlink(tmp_path: Path) -> None:\n    repository_root = tmp_path / "repo"\n    repository_root.mkdir()\n    bin_dir = tmp_path / "venv" / "bin"\n    bin_dir.mkdir(parents=True)\n    executable_link = bin_dir / "python"\n    executable_link.symlink_to(Path(sys.executable))\n\n    resolved = resolve_executable(\n        "python",\n        repository_root=repository_root,\n        search_environment={"PATH": str(bin_dir)},\n    )\n\n    assert resolved == executable_link.absolute()\n    assert resolved.is_symlink()\n''', encoding='utf-8')

      - name: Run targeted Code Builder tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest -q \
            tests/test_code_builder_execution_pipeline.py \
            tests/test_code_builder_executable_symlink.py

      - name: Commit verified repair
        run: |
          if git diff --quiet -- backend/code_builder/build_service.py backend/tests/test_code_builder_executable_symlink.py; then
            echo "No repair changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/code_builder/build_service.py backend/tests/test_code_builder_executable_symlink.py
          git commit -m "Preserve Code Builder virtualenv executable symlinks"
          git push origin HEAD:work/code-builder-refresh
