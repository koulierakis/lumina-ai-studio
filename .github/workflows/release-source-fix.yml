name: release-source-fix

on:
  push:
    branches:
      - release/lumina-complete

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lumina-complete
      - name: Repair automation delete response
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/productivity_router.py')
          text = path.read_text(encoding='utf-8')
          old = '@router.delete("/api/automations/tasks/{task_id}", status_code=204)'
          new = '@router.delete("/api/automations/tasks/{task_id}", status_code=204, response_model=None)'
          if old not in text and new not in text:
              raise SystemExit('Expected automation delete route marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify module compiles
        run: PYTHONPATH=backend python -m py_compile backend/productivity_router.py
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- backend/productivity_router.py; then
            echo 'No source repair required.'
            exit 0
          fi
          git config user.name 'Lumina Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/productivity_router.py
          git commit -m 'Fix automation delete response'
          git push origin HEAD:release/lumina-complete
