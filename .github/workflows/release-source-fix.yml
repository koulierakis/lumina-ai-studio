name: release-source-fix

on:
  push:
    branches:
      - release/lumina-complete

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lumina-complete
      - name: Repair verified missing runtime import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/server.py')
          text = path.read_text(encoding='utf-8')
          if '\nimport shutil\n' not in text:
              marker = '\nimport socket\n'
              if marker not in text:
                  raise SystemExit('Expected import marker was not found; refusing unsafe edit')
              text = text.replace(marker, marker + 'import shutil\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify repair
        run: |
          python -m py_compile backend/server.py
          grep -q '^import shutil$' backend/server.py
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- backend/server.py; then
            echo 'No source repair required.'
            exit 0
          fi
          git config user.name 'Lumina Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/server.py
          git commit -m 'Fix Talking Portrait audio probe runtime import'
          git push origin HEAD:release/lumina-complete
