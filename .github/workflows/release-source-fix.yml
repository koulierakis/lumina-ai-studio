name: release-source-fix

on:
  push:
    branches:
      - release/lumina-complete

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lumina-complete
      - name: Repair 204 delete routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/productivity_router.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '@router.delete("/api/finance/entries/{entry_id}", status_code=204)': '@router.delete("/api/finance/entries/{entry_id}", status_code=204, response_model=None)',
              '@router.delete("/api/research/items/{item_id}", status_code=204)': '@router.delete("/api/research/items/{item_id}", status_code=204, response_model=None)',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'Expected route marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify module imports
        run: |
          PYTHONPATH=backend python -m py_compile backend/productivity_router.py
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- backend/productivity_router.py; then
            echo 'No source repair required.'
            exit 0
          fi
          git config user.name 'Lumina Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/productivity_router.py
          git commit -m 'Fix empty delete responses in productivity routes'
          git push origin HEAD:release/lumina-complete
