name: Image Identity Targeted Audit

on:
  push:
    branches:
      - work/platform-auth-five-fixes-20260911
    paths:
      - '.github/workflows/image-identity-targeted-audit.yml'
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run only Image Studio and Identity Packs target tests
        env:
          PYTHONPATH: .
          LUMINA_ENV: development
          STORAGE_BACKEND: local
        run: pytest -q tests/test_identity_packs.py tests/test_editor_upload_pipeline.py tests/test_storage_backends.py
