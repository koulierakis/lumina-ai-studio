name: Patch Documents production runtime

on:
  push:
    branches: [work/documents-mind-completion]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/documents-mind-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch provider selection and dictation
        shell: python
        run: |
          from pathlib import Path

          panel = Path('frontend/src/components/documentstudio/DocumentAIAssistantPanel.jsx')
          text = panel.read_text(encoding='utf-8')
          old = '<option value="">Automatic (Ollama)</option>'
          new = '<option value="groq">Automatic (Groq)</option>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Provider option anchor not found')
          old = "const [provider, setProvider] = useState('');"
          new = "const [provider, setProvider] = useState('groq');"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Provider state anchor not found')
          panel.write_text(text, encoding='utf-8')

          mind = Path('frontend/src/pages/ExecutiveAdvisor.jsx')
          text = mind.read_text(encoding='utf-8')
          old = """    let committed = message.trim();
    recognition.onstart = () => { setListening(true); setError(''); };
    recognition.onend = () => setListening(false);
    recognition.onerror = (event) => {
      setListening(false);
      if (event.error !== 'aborted') setError(`Η φωνητική πληκτρολόγηση σταμάτησε: ${event.error || 'άγνωστο σφάλμα'}.`);
    };
    recognition.onresult = (event) => {
      let interim = '';
      for (let index = event.resultIndex; index < event.results.length; index += 1) {
        const transcript = event.results[index][0]?.transcript || '';
        if (event.results[index].isFinal) committed = `${committed} ${transcript}`.trim();
        else interim += transcript;
      }
      setMessage(`${committed}${interim ? ` ${interim}` : ''}`.trim());
    };"""
          new = """    const dictationBase = message.trim();
    recognition.onstart = () => { setListening(true); setError(''); };
    recognition.onend = () => setListening(false);
    recognition.onerror = (event) => {
      setListening(false);
      if (event.error !== 'aborted') setError(`Η φωνητική πληκτρολόγηση σταμάτησε: ${event.error || 'άγνωστο σφάλμα'}.`);
    };
    recognition.onresult = (event) => {
      let finalText = '';
      let interimText = '';
      // Web Speech re-emits earlier results while a phrase is evolving. Rebuild
      // the current utterance from the authoritative result list instead of
      // appending resultIndex deltas, otherwise interim/final text duplicates.
      for (let index = 0; index < event.results.length; index += 1) {
        const transcript = (event.results[index][0]?.transcript || '').trim();
        if (!transcript) continue;
        if (event.results[index].isFinal) finalText = `${finalText} ${transcript}`.trim();
        else interimText = `${interimText} ${transcript}`.trim();
      }
      setMessage([dictationBase, finalText, interimText].filter(Boolean).join(' ').replace(/\\s+/g, ' ').trim());
    };"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Dictation anchor not found')
          mind.write_text(text, encoding='utf-8')
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regression tests
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand src/components/documentstudio/DocumentAIAssistantPanel.providerStatus.test.jsx src/pages/ExecutiveAdvisor.test.js
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Commit validated patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/documentstudio/DocumentAIAssistantPanel.jsx frontend/src/pages/ExecutiveAdvisor.jsx
          git commit -m "fix(runtime): use Groq in Documents and dedupe dictation"
          git push origin HEAD:work/documents-mind-completion
