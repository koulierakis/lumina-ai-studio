name: Patch Documents production runtime

on:
  push:
    branches:
      - work/documents-mind-completion

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/documents-mind-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic runtime patch
        run: python scripts/patch_documents_production_runtime.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regression tests
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand src/components/documentstudio/DocumentAIAssistantPanel.providerStatus.test.jsx src/pages/ExecutiveAdvisor.test.js
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Commit validated runtime patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/documentstudio/DocumentAIAssistantPanel.jsx frontend/src/pages/ExecutiveAdvisor.jsx
          git commit -m "fix(runtime): use Groq in Documents and dedupe dictation"
          git push origin HEAD:work/documents-mind-completion
