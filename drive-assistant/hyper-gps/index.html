<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#05070a"><title>ApexDrive Copilot · LUMINA</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="app-container"><div id="map" aria-label="Χάρτης"></div>
<div id="nav-banner" class="glass-panel nav-hidden"><div class="turn-icon-box">↱</div><div class="turn-info"><strong id="turn-distance">—</strong><span id="turn-instruction">Πορεία</span></div><button id="btn-cancel-nav" class="btn-icon" aria-label="Τέλος διαδρομής">✕</button></div>
<div id="radar-warning-card" class="radar-card hidden"><span>⚠</span><div class="radar-text"><h4>Σημείο ελέγχου</h4><p><span id="radar-distance">—</span> μ. · <span id="radar-limit">—</span> km/h</p></div></div><div id="radar-flash-overlay" class="radar-flash"></div>
<form id="destination-form" class="glass-panel destination-panel"><label for="destination-input">Πού θέλεις να πας;</label><div><input id="destination-input" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destination-suggestions" placeholder="Προορισμός ή διεύθυνση" required><button type="submit" class="btn-neon-action">Πορεία</button></div><div id="destination-suggestions" class="destination-suggestions hidden" role="listbox" aria-label="Προτεινόμενες διευθύνσεις"></div><div id="place-results" class="place-results hidden" aria-label="Αποτελέσματα αναζήτησης"></div><p id="gps-status" role="status">Αναμονή τοποθεσίας…</p></form>
<div id="trip-panel" class="glass-panel trip-panel"><div>Διαδρομή <strong id="trip-distance">0</strong> χλμ. · Καύσιμα <strong id="trip-cost">—</strong></div><small id="wake-lock-status">Οθόνη: κανονική λειτουργία</small><details><summary>Ρύθμιση καυσίμου</summary><label>λίτρα/100 χλμ. <input id="fuel-consumption" type="number" min="0.1" max="100" step="0.1" inputmode="decimal" placeholder="π.χ. 7"></label><label>€/λίτρο <input id="fuel-price" type="number" min="0.01" max="10" step="0.01" inputmode="decimal" placeholder="π.χ. 1,80"></label></details></div>
<div class="quick-controls"><button id="btn-recenter" class="glass-circle" aria-label="Η θέση μου">◎<span>ΘΕΣΗ</span></button><button id="btn-theme-toggle" class="glass-circle" aria-label="Ημέρα ή νύχτα">◐<span>ΦΩΣ</span></button><button id="btn-hud-mode" class="glass-circle" aria-label="Λειτουργία καθρέφτη">⇄<span>HUD</span></button><button id="btn-favorites" class="glass-circle" aria-label="Αγαπημένα">★<span>PIN</span></button></div>
<div id="cockpit-hud" class="glass-panel"><div class="speed-box"><span id="speed-display" class="digital-speed">00</span><small class="speed-unit">KM/H</small></div><div class="voice-assistant-cluster"><button id="btn-voice-mic" class="voice-core-btn" aria-label="Φωνητική εντολή">🎙</button><button id="btn-wake-mode" type="button" class="wake-toggle" aria-pressed="false">Τζούλι OFF</button><label class="voice-select-label" for="voice-choice">Φωνή <select id="voice-choice" aria-describedby="voice-availability"><option value="female">Γυναικεία</option><option value="male">Αντρική</option></select></label><span id="voice-availability" class="voice-availability"></span><span id="voice-status" class="voice-status-text">ΦΩΝΗ</span></div><div class="eta-box"><div class="eta-item">◷ <span id="route-eta">--:--</span></div><div class="eta-item">◇ <span id="route-distance">-- km</span></div></div></div>
<div id="favorites-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Αγαπημένα"><div class="glass-panel modal-content"><div class="modal-header"><h2>Αγαπημένα</h2><button id="btn-close-favs" class="btn-icon" aria-label="Κλείσιμο">✕</button></div><div class="fav-quick-grid"><button class="btn-fav-card" data-key="home">⌂ Σπίτι</button><button class="btn-fav-card" data-key="work">▣ Δουλειά</button></div><div id="favorites-list" class="fav-custom-list"></div><div class="fav-add-box"><input id="fav-name-input" placeholder="Όνομα τρέχουσας θέσης"><button id="btn-save-current-loc" class="btn-neon-action">Αποθήκευση</button></div></div></div>
</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="js/app.js"></script></body></html>
