<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>LUMINA Driver Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif;transition:.18s}body.danger{background:#8b0712;animation:flash .55s infinite alternate}@keyframes flash{to{background:#ef233c}}.app{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 14px 28px}header{padding:18px 2px}.brand{color:#50d0c8;font-size:12px;font-weight:900;letter-spacing:3px}h1{font-size:25px;margin:2px 0}.card{background:#101d2e;border:1px solid #1d3149;border-radius:22px;padding:17px;margin-bottom:12px}.dash{display:grid;grid-template-columns:1fr 1fr;gap:12px}.speed{text-align:center}.speed strong{display:block;font-size:74px;line-height:.95}.muted{color:#92a6bd}.coords{font-size:13px;line-height:1.5}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:70px;border:0;border-radius:18px;background:#172a42;color:#fff;font-weight:800;font-size:15px;padding:12px;touch-action:manipulation}.btn.primary{background:#1597e5}.btn.green{background:#21b66f}.btn.red{background:#d7263d}.btn.active{background:#0f7f52}.wide{width:100%;margin-top:10px}.notice{background:#091522;border-radius:15px;padding:13px;margin-top:10px;color:#cfe3f7}input{width:100%;border:1px solid #29425f;background:#091522;color:#fff;border-radius:15px;padding:15px;font-size:16px}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status div{text-align:center;background:#091522;border-radius:14px;padding:12px 5px}.status b{display:block;font-size:13px}.status small{color:#8da3ba;font-size:10px}</style></head><body><div class="app"><header><div class="brand">LUMINA</div><h1>Driver Assistant</h1></header><section class="card dash"><div class="speed"><strong id="speed">0</strong><span class="muted">km/h</span></div><div><b>GPS</b><div id="gps" class="coords muted">Πάτησε FREE DRIVE για ενεργοποίηση</div><p><b>Ακρίβεια</b><br><span id="accuracy" class="muted">—</span></p></div></section><section class="card"><div class="buttons"><button type="button" id="freeDriveBtn" class="btn green">🧭 FREE DRIVE</button><button type="button" id="gpsBtn" class="btn primary">📍 GPS</button><button type="button" id="voiceBtn" class="btn">🎙️ ΦΩΝΗ</button><button type="button" id="statusBtn" class="btn">🔊 STATUS</button><button type="button" id="dangerBtn" class="btn red">⚠️ DANGER</button><button type="button" id="stopBtn" class="btn">⏹ STOP ALERT</button></div><div id="notice" class="notice">Έτοιμο. Μπορείς να ρωτήσεις και «πόσο μακριά είναι η Αθήνα από εδώ;»</div></section><section class="card"><b>LUMINA AI Assistant</b><div id="chat" class="notice">Η διαδρομή σας είναι ασφαλής.</div><input id="prompt" placeholder="Ρώτησε τον LUMINA…"><button type="button" id="askBtn" class="btn primary wide">ΑΠΟΣΤΟΛΗ & ΟΜΙΛΙΑ</button></section><section class="card status"><div><b id="gpsState">OFF</b><small>GPS</small></div><div><b id="driveState">OFF</b><small>FREE DRIVE</small></div><div><b id="voiceState">READY</b><small>VOICE</small></div></section></div><script>(()=>{'use strict';let watchId=null,currentSpeed=0,freeDrive=false,recognition=null,listening=false,currentLat=null,currentLon=null;const $=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.95;window.speechSynthesis.speak(u)}function danger(on){document.body.classList.toggle('danger',on);$('chat').textContent=on?'ΠΡΟΣΟΧΗ: Κίνδυνος.':'Η προειδοποίηση απενεργοποιήθηκε.';if(on)navigator.vibrate?.([250,100,250])}function gpsError(e){$('gpsState').textContent='ERROR';$('notice').textContent=e.code===1?'Η τοποθεσία είναι μπλοκαρισμένη. Chrome → Ρυθμίσεις ιστοτόπου → Τοποθεσία → Να επιτρέπεται.':e.code===2?'Δεν υπάρχει διαθέσιμο σήμα GPS.':'Το GPS δεν απάντησε. Δοκίμασε σε ανοιχτό χώρο.'}function startGPS(){return new Promise(resolve=>{if(!('geolocation'in navigator)){gpsError({code:2});resolve(false);return}if(watchId!==null&&currentLat!==null){resolve(true);return}$('notice').textContent='Ζητώ άδεια τοποθεσίας…';navigator.geolocation.getCurrentPosition(p=>{updatePosition(p);$('gpsState').textContent='ON';$('notice').textContent='GPS ενεργό.';watchId=navigator.geolocation.watchPosition(updatePosition,gpsError,{enableHighAccuracy:true,maximumAge:0,timeout:20000});resolve(true)},e=>{gpsError(e);resolve(false)},{enableHighAccuracy:true,maximumAge:0,timeout:20000})})}function updatePosition(p){const c=p.coords;currentLat=c.latitude;currentLon=c.longitude;currentSpeed=Number.isFinite(c.speed)?Math.max(0,c.speed*3.6):0;$('speed').textContent=Math.round(currentSpeed);$('gps').textContent=currentLat.toFixed(6)+', '+currentLon.toFixed(6);$('accuracy').textContent='±'+Math.round(c.accuracy)+' m';$('gpsState').textContent='ON'}async function toggleFreeDrive(){if(freeDrive){freeDrive=false;$('driveState').textContent='OFF';$('freeDriveBtn').classList.remove('active');$('freeDriveBtn').textContent='🧭 FREE DRIVE';$('notice').textContent='Free Drive σταμάτησε.';return}const ok=await startGPS();if(!ok)return;freeDrive=true;$('driveState').textContent='ON';$('freeDriveBtn').classList.add('active');$('freeDriveBtn').textContent='⏹ STOP DRIVE';$('notice').textContent='Free Drive ενεργό — GPS και ταχύμετρο λειτουργούν.';say('Το Free Drive ενεργοποιήθηκε.')}function status(){const t='Η τρέχουσα ταχύτητα είναι '+Math.round(currentSpeed)+' χιλιόμετρα την ώρα.';$('chat').textContent=t;say(t)}function cleanDestination(raw){let s=raw.toLowerCase().replace(/[;,.?!]/g,' ').replace(/\s+/g,' ').trim();const starters=['θέλω να μου πεις πόσο μακριά είναι','πες μου πόσο μακριά είναι','πόσο μακριά είναι','πόσα χιλιόμετρα είναι','πόση απόσταση είναι'];for(const x of starters)if(s.includes(x)){s=s.split(x).pop().trim();break}s=s.replace(/\b(από εδώ|από δω|από εδω|από εδώ που είμαι|απο εδώ|απο δω|απο εδω)\b/g,'').trim();s=s.replace(/^(η|ο|το|στην|στη|στο|στην πόλη)\s+/,'').trim();return s}async function answerDistanceQuestion(raw){const destination=cleanDestination(raw);if(!destination||destination.length<2)return false;$('notice').textContent='Υπολογίζω απόσταση προς '+destination+'…';const gpsOk=await startGPS();if(!gpsOk||currentLat===null)return true;try{const geoUrl='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=el&q='+encodeURIComponent(destination+', Greece');const gr=await fetch(geoUrl,{headers:{'Accept':'application/json'}});if(!gr.ok)throw new Error('geocode');const places=await gr.json();if(!places.length){const t='Δεν βρήκα τον προορισμό '+destination+'.';$('chat').textContent=t;$('notice').textContent=t;say(t);return true}const dlat=parseFloat(places[0].lat),dlon=parseFloat(places[0].lon),name=(places[0].display_name||destination).split(',')[0];const routeUrl='https://router.project-osrm.org/route/v1/driving/'+currentLon+','+currentLat+';'+dlon+','+dlat+'?overview=false&steps=false';const rr=await fetch(routeUrl);if(!rr.ok)throw new Error('route');const data=await rr.json();if(data.code!=='Ok'||!data.routes?.length)throw new Error('route');const km=data.routes[0].distance/1000;const mins=Math.round(data.routes[0].duration/60);const hours=Math.floor(mins/60),rem=mins%60;const timeText=hours>0?hours+' ώρες και '+rem+' λεπτά':mins+' λεπτά';const t='Η οδική απόσταση μέχρι '+name+' είναι περίπου '+Math.round(km)+' χιλιόμετρα. Εκτιμώμενος χρόνος '+timeText+'.';$('chat').textContent=t;$('notice').textContent='Υπολογισμός από πραγματικά δεδομένα OpenStreetMap / OSRM.';say(t);return true}catch(e){const t='Δεν μπόρεσα να υπολογίσω τώρα την απόσταση. Έλεγξε τη σύνδεση στο ίντερνετ και ξαναδοκίμασε.';$('chat').textContent=t;$('notice').textContent=t;say(t);return true}}async function processQuery(raw){const c=raw.toLowerCase().trim();$('chat').textContent='Άκουσα: '+raw;if(c.includes('stop')||c.includes('στοπ')||c.includes('danger')||c.includes('κίνδυ')){danger(true);say('Προσοχή. Κίνδυνος.');return}if(c.includes('status')||c.includes('κατάσταση')){status();return}if(c.includes('πόσο μακριά')||c.includes('πόσα χιλιόμετρα')||c.includes('πόση απόσταση')){await answerDistanceQuestion(raw);return}if(c.includes('ταχύ')){status();return}const t='Κατέγραψα την ερώτηση, αλλά αυτή η έκδοση απαντά προς το παρόν σε απόσταση προορισμού, ταχύτητα, status και εντολές κινδύνου.';$('chat').textContent=t;say(t)}async function ensureMicPermission(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return true;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());return true}catch(e){$('voiceState').textContent='BLOCKED';$('notice').textContent='Το μικρόφωνο είναι μπλοκαρισμένο. Chrome → Ρυθμίσεις ιστοτόπου → Μικρόφωνο → Να επιτρέπεται.';return false}}async function toggleVoice(){if(listening){try{recognition?.stop()}catch{}return}const ok=await ensureMicPermission();if(!ok)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceState').textContent='N/A';$('notice').textContent='Η φωνητική αναγνώριση δεν υποστηρίζεται από αυτόν τον browser.';return}recognition=new SR();recognition.lang='el-GR';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;$('voiceState').textContent='LISTENING';$('voiceBtn').classList.add('active');$('voiceBtn').textContent='🎙️ ΑΚΟΥΩ…';$('notice').textContent='Μίλα τώρα.'};recognition.onspeechstart=()=>{$('notice').textContent='Σε ακούω…'};recognition.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||'';if(text)processQuery(text)};recognition.onerror=e=>{const map={'not-allowed':'Δεν επιτρέπεται το μικρόφωνο.','audio-capture':'Δεν βρέθηκε μικρόφωνο.','no-speech':'Δεν άκουσα ομιλία. Ξαναπάτησε ΦΩΝΗ.','network':'Η φωνητική υπηρεσία χρειάζεται σύνδεση internet.','aborted':'Η ακρόαση σταμάτησε.'};$('notice').textContent=map[e.error]||('Σφάλμα φωνής: '+e.error)};recognition.onend=()=>{listening=false;$('voiceState').textContent='READY';$('voiceBtn').classList.remove('active');$('voiceBtn').textContent='🎙️ ΦΩΝΗ'};try{recognition.start()}catch(e){$('notice').textContent='Δεν μπόρεσε να ξεκινήσει η φωνή. Ξαναπάτησε ΦΩΝΗ.'}}function bind(id,fn){$(id).addEventListener('click',fn)}bind('freeDriveBtn',toggleFreeDrive);bind('gpsBtn',startGPS);bind('voiceBtn',toggleVoice);bind('statusBtn',status);bind('dangerBtn',()=>{danger(true);say('Προσοχή. Κίνδυνος.')});bind('stopBtn',()=>danger(false));bind('askBtn',()=>{const q=$('prompt').value.trim();if(!q)return;processQuery(q);$('prompt').value=''});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')$('askBtn').click()});})();</script></body></html>
