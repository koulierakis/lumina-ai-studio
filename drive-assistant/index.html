<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>LUMINA Driver Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f8fc;font-family:system-ui,-apple-system,sans-serif;transition:.18s}body.danger{background:#8b0712;animation:flash .55s infinite alternate}@keyframes flash{to{background:#ef233c}}.app{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 14px 28px}header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px}.brand{color:#42b7ff;font-size:12px;font-weight:900;letter-spacing:3px}h1{font-size:25px;margin:2px 0}.badge{padding:8px 11px;border-radius:99px;background:#14243a;color:#9fb1c7;font-size:11px}.card{background:#101d2e;border:1px solid #1d3149;border-radius:22px;padding:17px;margin-bottom:12px}.dash{display:grid;grid-template-columns:1fr 1fr;gap:12px}.speed{text-align:center}.speed strong{display:block;font-size:74px;line-height:.95}.speed small,.muted{color:#92a6bd}.coords{font-size:13px;line-height:1.5;word-break:break-word}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:68px;border:0;border-radius:18px;background:#172a42;color:#fff;font-weight:800;font-size:15px;padding:12px}.btn.primary{background:#1597e5}.btn.green{background:#21b66f}.btn.red{background:#d7263d}.btn:active{transform:scale(.98)}.wide{width:100%;margin-top:10px}input{width:100%;border:1px solid #29425f;background:#091522;color:#fff;border-radius:15px;padding:15px;font-size:16px;outline:0}.chat{min-height:80px;background:#091522;border-radius:15px;padding:13px;margin:10px 0;color:#cfe3f7}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status div{text-align:center;background:#091522;border-radius:14px;padding:12px 5px}.status b{display:block;font-size:13px}.status small{color:#8da3ba;font-size:10px}#voiceState{color:#45d98b;font-weight:800}footer{text-align:center;color:#71869d;font-size:11px;padding:10px}</style></head><body><div class="app"><header><div><div class="brand">LUMINA</div><h1>Driver Assistant</h1></div><div id="online" class="badge">ONLINE</div></header><section class="card dash"><div class="speed"><strong id="speed">0</strong><small>km/h</small></div><div><b>GPS</b><div id="gps" class="coords muted">Αναμονή άδειας τοποθεσίας…</div><p><b>Ακρίβεια</b><br><span id="accuracy" class="muted">—</span></p></div></section><section class="card"><div class="buttons"><button id="gpsBtn" class="btn primary">📍 ΕΝΑΡΞΗ GPS</button><button id="voiceBtn" class="btn green">🎙️ ΦΩΝΗ</button><button id="statusBtn" class="btn">🔊 STATUS</button><button id="dangerBtn" class="btn red">⚠️ DANGER</button></div><button id="stopBtn" class="btn wide">⏹ STOP ALERT</button></section><section class="card"><b>LUMINA AI Assistant</b><div id="chat" class="chat">Έτοιμος για οδήγηση. Η διαδρομή σας είναι ασφαλής.</div><input id="prompt" placeholder="Ρώτησε τον LUMINA…"><button id="askBtn" class="btn primary wide">ΑΠΟΣΤΟΛΗ & ΟΜΙΛΙΑ</button></section><section class="card status"><div><b id="gpsState">OFF</b><small>GPS</small></div><div><b id="voiceState">READY</b><small>VOICE</small></div><div><b id="netState">ONLINE</b><small>NETWORK</small></div></section><footer>Mobile Web • GPS • Web Speech • LUMINA-ready</footer></div><script>(()=>{'use strict';let watch=null,currentSpeed=0,recognition=null,listening=false;const $=id=>document.getElementById(id);function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.95;speechSynthesis.speak(u)}function setDanger(on){document.body.classList.toggle('danger',on);if(on){navigator.vibrate?.([250,100,250]);$('chat').textContent='ΠΡΟΣΟΧΗ: Ενεργοποιήθηκε προειδοποίηση κινδύνου.'}else $('chat').textContent='Η προειδοποίηση απενεργοποιήθηκε.'}function startGPS(){if(!navigator.geolocation){$('gps').textContent='Το GPS δεν υποστηρίζεται.';return}if(watch!==null)return;$('gpsState').textContent='ON';watch=navigator.geolocation.watchPosition(p=>{const c=p.coords;currentSpeed=Number.isFinite(c.speed)?Math.max(0,c.speed*3.6):0;$('speed').textContent=Math.round(currentSpeed);$('gps').textContent=c.latitude.toFixed(6)+', '+c.longitude.toFixed(6);$('accuracy').textContent='±'+Math.round(c.accuracy)+' m'},e=>{$('gpsState').textContent='ERROR';$('gps').textContent=e.code===1?'Δεν δόθηκε άδεια τοποθεσίας.':'GPS μη διαθέσιμο.'},{enableHighAccuracy:true,maximumAge:500,timeout:15000})}function status(){const t='Η τρέχουσα ταχύτητα είναι '+Math.round(currentSpeed)+' χιλιόμετρα την ώρα.';$('chat').textContent=t;speak(t)}function handleCommand(raw){const c=raw.toLowerCase().trim();$('chat').textContent='Άκουσα: '+raw;if(c.includes('stop')||c.includes('στοπ')||c.includes('danger')||c.includes('κίνδυ')){setDanger(true);speak('Προσοχή. Κίνδυνος.');return}if(c.includes('status')||c.includes('κατάσταση')){status();return}if(c.includes('safe')||c.includes('ασφαλ')){setDanger(false);speak('Η προειδοποίηση απενεργοποιήθηκε.');return}speak('Η εντολή καταγράφηκε.')}function toggleVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceState').textContent='N/A';$('chat').textContent='Η φωνητική αναγνώριση δεν υποστηρίζεται από αυτόν τον browser.';return}if(listening){recognition?.stop();return}recognition=new SR();recognition.lang='el-GR';recognition.continuous=true;recognition.interimResults=false;recognition.onstart=()=>{listening=true;$('voiceState').textContent='LISTENING';$('voiceBtn').textContent='🎙️ ΑΚΟΥΩ…'};recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)handleCommand(e.results[i][0].transcript)};recognition.onerror=e=>{$('chat').textContent='Voice: '+e.error};recognition.onend=()=>{listening=false;$('voiceState').textContent='READY';$('voiceBtn').textContent='🎙️ ΦΩΝΗ'};recognition.start()}function mockAI(q){const s=q.toLowerCase();let a='Η διαδρομή σας είναι ασφαλής. Παραμένω διαθέσιμος για οδηγική υποστήριξη.';if(s.includes('ταχύ'))a='Η τρέχουσα ταχύτητά σας είναι '+Math.round(currentSpeed)+' km/h.';else if(s.includes('gps')||s.includes('θέση'))a=$('gpsState').textContent==='ON'?'Το GPS είναι ενεργό και παρακολουθεί την τρέχουσα θέση.':'Το GPS δεν είναι ενεργό.';else if(s.includes('κίνδ'))a='Δεν έχω ανεξάρτητη live πηγή κινδύνων σε αυτή την έκδοση. Χρησιμοποιήστε τις ειδοποιήσεις μόνο ως βοήθημα.';return a}$('gpsBtn').onclick=startGPS;$('voiceBtn').onclick=toggleVoice;$('statusBtn').onclick=status;$('dangerBtn').onclick=()=>{setDanger(true);speak('Προσοχή. Κίνδυνος.')};$('stopBtn').onclick=()=>setDanger(false);$('askBtn').onclick=()=>{const q=$('prompt').value.trim();if(!q)return;const a=mockAI(q);$('chat').textContent=a;speak(a);$('prompt').value=''};$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')$('askBtn').click()});function network(){const on=navigator.onLine;$('online').textContent=on?'ONLINE':'OFFLINE';$('netState').textContent=on?'ONLINE':'OFFLINE'}addEventListener('online',network);addEventListener('offline',network);network()})();</script></body></html>
