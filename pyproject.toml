[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git", ".venv", "venv", "node_modules", "build", "dist", "backups",
  "_local_models", ".lumina-runtime"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E402", "E501", "E701", "E702",
  "UP022", "UP035", "UP042",
  "B007", "B008", "B904",
  "SIM102", "SIM103", "SIM105", "SIM108", "SIM110"
]

[tool.ruff.lint.per-file-ignores]
"backend/code_builder/router.py" = ["F841"]
"backend/code_builder/patch_service.py" = ["F841"]
"backend/document_studio/service.py" = ["F841"]
"backend/providers/__init__.py" = ["F401"]
"backend/talking_face_providers/__init__.py" = ["F401"]
"backend/tests/test_document_studio_unit.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "launcher/tests"]
addopts = "-ra --strict-markers"
