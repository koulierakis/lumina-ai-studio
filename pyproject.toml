[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git", ".venv", "venv", "node_modules", "build", "dist", "backups",
  "_local_models", ".lumina-runtime"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP042", "SIM105", "SIM108", "B007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "launcher/tests"]
addopts = "-ra --strict-markers"
