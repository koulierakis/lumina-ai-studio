name: lumina-dev
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks: [lumina-network]

  redis:
    image: redis:7
    container_name: lumina-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [lumina-network]

  postgres:
    image: postgres:17
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Lumina_Local_2026_Strong}
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina} -d ${POSTGRES_DB:-lumina}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lumina-network]

  minio:
    image: minio/minio:latest
    container_name: lumina-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lumina}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Lumina_Local_2026_Strong}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [lumina-network]

  sonarqube:
    image: sonarqube:lts-community
    container_name: lumina-sonarqube
    restart: unless-stopped
    ports:
      - "9002:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks: [lumina-network]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "3001:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks: [lumina-network]

  grafana:
    image: grafana/grafana:latest
    container_name: lumina-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [lumina-network]

  prometheus:
    image: prom/prometheus:latest
    container_name: lumina-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [lumina-network]

networks:
  lumina-network:
    name: lumina-network

volumes:
  qdrant_storage:
  redis_data:
  postgres_data:
  minio_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  open_webui_data:
  grafana_data:
